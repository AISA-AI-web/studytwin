<script>
/**
 * StudyTwin single-page app.
 *
 * Apps Script serves one HTML document, so navigation happens here rather than
 * over the network — important because each Apps Script page load costs a
 * cold start. Data comes from Api.gs via google.script.run.
 */
(function () {
  'use strict';

  var state = {
    user: window.BOOTSTRAP_USER || null,
    bootstrap: null,
    view: 'home',
    params: {},
    answers: {},     // current worksheet answers, keyed by question id
    lastResults: null
  };

  var view = document.getElementById('view');
  var nav = document.getElementById('nav');
  var userChip = document.getElementById('userChip');

  /* ---------------------------------------------------------------------
   * Server bridge
   * ------------------------------------------------------------------- */

  /** Promise wrapper around google.script.run, unwrapping the Api.gs envelope. */
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) { resolve(res.data); return; }
          if (res && (res.message || res.error)) {
            reject(new Error(res.message || res.error));
            return;
          }
          // Nothing came back at all. The server ran but its reply did not survive the
          // boundary, so there is no error to report — say which call, so it is findable.
          reject(new Error('The server did not return anything for "' + name + '". ' +
            'Ask your administrator to run diagnose() in the Apps Script editor.'));
        })
        .withFailureHandler(function (err) {
          reject(new Error((err && err.message) ||
            'Could not reach the server (' + name + ').'));
        });
      runner[name].apply(runner, args);
    });
  }

  /* ---------------------------------------------------------------------
   * Helpers
   * ------------------------------------------------------------------- */

  /** Escapes text before it goes anywhere near innerHTML. */
  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /**
   * Renders the small subset of inline markup lesson authors may use.
   * Everything is escaped first, so only these exact patterns survive —
   * lesson JSON can style text without being able to inject scripts.
   */
  function richText(value) {
    return esc(value)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[\[(.+?)\]\]/g, '<span class="keyword">$1</span>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  function initials(name) {
    return String(name || '?').split(/\s+/).slice(0, 2)
      .map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
  }

  function formatDate(value) {
    if (!value) return '—';
    var d = new Date(value);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function toast(message, isError) {
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, isError ? 6000 : 3000);
  }

  function showSpinner() {
    view.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';
  }

  function showError(err) {
    view.innerHTML = '<div class="empty"><h3>Something went wrong</h3>' +
      '<p class="muted">' + esc(err.message) + '</p>' +
      '<p style="margin-top:1rem"><button class="btn btn--ghost" id="retry">Try again</button></p></div>';
    document.getElementById('retry').onclick = function () { route(state.view, state.params); };
  }

  /** Percentage ring used in the progress hero. */
  function ring(percent) {
    var r = 44, c = 2 * Math.PI * r;
    var offset = c * (1 - Math.max(0, Math.min(100, percent)) / 100);
    return '<div class="ring"><svg width="104" height="104">' +
      '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/>' +
      '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="#D8B664" stroke-width="9" ' +
      'stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '"/>' +
      '</svg><div class="ring-label">' + Math.round(percent) + '%</div></div>';
  }

  /* ---------------------------------------------------------------------
   * Chrome: nav + user chip
   * ------------------------------------------------------------------- */

  function renderChrome() {
    var user = state.user || {};
    // Show the address Google actually authenticated, not just a display name. With
    // several Google accounts signed in, the browser can open the app as a different
    // person, and a name alone makes that impossible to notice.
    var app = (state.bootstrap && state.bootstrap.app) || {};
    userChip.innerHTML =
      '<div class="avatar">' + esc(initials(user.displayName)) + '</div>' +
      '<div><div class="name">' + esc(user.displayName) + '</div>' +
      '<div class="account">' + esc(user.email) + '</div></div>' +
      '<div class="role-tag">' + esc(user.role) + '</div>' +
      (app.switchAccountUrl
        ? '<a class="switch" href="' + esc(app.switchAccountUrl) + '" target="_blank" ' +
          'rel="noopener" title="Open the app as a different Google account">Not you?</a>'
        : '');

    var items = [
      { key: 'home', label: 'My Learning' },
      { key: 'results', label: 'My Progress' }
    ];
    if (user.role === 'teacher' || user.role === 'admin') {
      items.push({ key: 'teacher', label: 'Class Tracking' });
    }
    if (user.role === 'admin') {
      items.push({ key: 'admin', label: 'Admin' });
    }

    nav.innerHTML = items.map(function (item) {
      var active = state.view === item.key ||
        (item.key === 'teacher' && state.view === 'student-detail') ||
        (item.key === 'home' && state.view === 'lesson');
      return '<button data-nav="' + item.key + '"' + (active ? ' class="active"' : '') + '>' +
        esc(item.label) + '</button>';
    }).join('');

    Array.prototype.forEach.call(nav.querySelectorAll('[data-nav]'), function (btn) {
      btn.onclick = function () { route(btn.getAttribute('data-nav'), {}); };
    });
  }

  /* ---------------------------------------------------------------------
   * Router
   * ------------------------------------------------------------------- */

  function route(name, params) {
    state.view = name;
    state.params = params || {};
    renderChrome();
    showSpinner();
    window.scrollTo(0, 0);

    var views = {
      'home': viewHome,
      'lesson': viewLesson,
      'results': viewResults,
      'teacher': viewTeacher,
      'student-detail': viewStudentDetail,
      'admin': viewAdmin
    };
    (views[name] || viewHome)().catch(showError);
  }

  /* ---------------------------------------------------------------------
   * Student: course home
   * ------------------------------------------------------------------- */

  function viewHome() {
    return call('api_getBootstrap').then(function (data) {
      state.bootstrap = data;
      state.user = data.user;
      renderChrome();

      var lessons = data.lessons;
      var submitted = lessons.filter(function (l) { return l.status === 'submitted'; }).length;
      var pct = lessons.length ? (submitted / lessons.length) * 100 : 0;
      var byId = {};
      lessons.forEach(function (l) { byId[l.id] = l; });

      var html =
        '<section class="hero">' +
          ring(pct) +
          '<div class="hero-text">' +
            '<div class="eyebrow">' + esc(data.course.title) + '</div>' +
            '<h1>Hello, ' + esc((data.user.displayName || '').split(' ')[0]) + '</h1>' +
            '<p style="color:rgba(255,255,255,.8)">' +
              (submitted === 0
                ? 'Start with Lesson 1 below. Work through each lesson, then complete its worksheet.'
                : 'You have handed in ' + submitted + ' of ' + lessons.length + ' worksheets. Keep going.') +
            '</p>' +
          '</div>' +
          '<div class="hero-stats">' +
            '<div class="stat"><div class="value">' + submitted + '/' + lessons.length + '</div>' +
              '<div class="label">Worksheets in</div></div>' +
            '<div class="stat"><div class="value">' + data.profile.judgedCount + '/' +
              data.profile.strandsTotal + '</div>' +
              '<div class="label">Strands judged</div></div>' +
          '</div>' +
        '</section>';

      // Bridging and the Main Course are separate programmes taught in sequence, so
      // they are shown as such rather than as one undifferentiated list of weeks.
      var tracks = [];
      data.units.forEach(function (unit) {
        var track = unit.track || 'main';
        var group = tracks.filter(function (t) { return t.track === track; })[0];
        if (!group) { group = { track: track, units: [] }; tracks.push(group); }
        group.units.push(unit);
      });

      html += tracks.map(function (group) {
        var meta = (data.course.tracks || {})[group.track] || {};
        var header = '<div class="track-head">' +
          '<div class="eyebrow">' + (group.track === 'bridging' ? 'Taught first' : 'Main programme') +
          '</div><h2>' + esc(meta.title || group.track) + '</h2>' +
          (meta.summary ? '<p class="muted small">' + esc(meta.summary) + '</p>' : '') +
          '<p class="muted small">' + group.units.length + ' weeks</p></div>';

        return '<section class="track">' + header + group.units.map(function (unit) {
          var cards = (unit.lessons || []).map(function (id) {
            return byId[id] ? lessonCard(byId[id]) : '';
          }).join('');
          return '<div class="unit"><div class="unit-head"><h3>' + esc(unit.title) + '</h3>' +
            (unit.summary ? '<p class="muted small">' + esc(unit.summary) + '</p>' : '') + '</div>' +
            '<div class="lesson-grid">' + cards + '</div></div>';
        }).join('') + '</section>';
      }).join('');

      view.innerHTML = html;
      bindLessonCards();
    });
  }

  function lessonCard(lesson) {
    var statusLabels = { 'submitted': 'Handed in', 'not-started': 'Not started' };
    var isLab = lesson.type === 'lab';
    var ctx = lesson.context || { week: lesson.week, phase: '' };
    return '<button class="lesson-card' + (isLab ? ' is-lab' : '') + '" data-lesson="' + esc(lesson.id) + '">' +
      '<div class="top">' +
        '<div class="lesson-num" title="Week ' + esc(ctx.week) + '">' +
          '<span class="lesson-num__label">WK</span>' + esc(ctx.week) + '</div>' +
        '<span class="pill ' + (isLab ? 'pill--lab' : 'pill--lesson') + '">' +
          (isLab ? 'Lab' : 'Core') + '</span>' +
        (ctx.phase ? '<span class="muted small">' + esc(ctx.phase) + '</span>' : '') +
      '</div>' +
      '<h3>' + esc(lesson.title) + '</h3>' +
      '<p>' + esc(lesson.summary) + '</p>' +
      '<div class="lesson-meta">' +
        '<span class="pill pill--' + esc(lesson.status) + '">' + esc(statusLabels[lesson.status]) + '</span>' +
        (lesson.worksheetScore !== null
          ? '<span class="muted small">' + esc(lesson.marksAwarded) + '/' +
            esc(lesson.marksAvailable) + ' marks</span>'
          : '<span class="muted small">' + esc(lesson.marksAvailable) + ' marks available</span>') +
      '</div></button>';
  }

  function bindLessonCards() {
    Array.prototype.forEach.call(view.querySelectorAll('[data-lesson]'), function (el) {
      el.onclick = function () { route('lesson', { id: el.getAttribute('data-lesson') }); };
    });
  }

  /* ---------------------------------------------------------------------
   * Student: a single lesson
   * ------------------------------------------------------------------- */

  function viewLesson() {
    return call('api_getLesson', state.params.id).then(function (data) {
      state.answers = {};
      state.lastResults = null;
      var lesson = data.lesson;
      var ctx = data.context || { week: lesson.week, trackTitle: '', weeksTotal: null };
      var isLab = lesson.type === 'lab';

      var html = '<button class="breadcrumb" id="back">← Back to My Learning</button>' +
        '<div class="lesson-head">' +
          '<div class="eyebrow">' + esc(ctx.trackTitle) + '</div>' +
          '<h1>' + esc(lesson.title) + '</h1>' +
          '<div class="lesson-crumbs">' +
            '<span class="crumb crumb--week">Week ' + esc(ctx.week) +
              (ctx.weeksTotal ? ' of ' + esc(ctx.weeksTotal) : '') + '</span>' +
            '<span class="crumb">' + (isLab ? 'Lab' : 'Core') + '</span>' +
            (ctx.phase ? '<span class="crumb">' + esc(ctx.phase) + '</span>' : '') +
            (ctx.arcName
              ? '<span class="crumb crumb--arc">' + esc(ctx.arcName) + ' ' +
                esc(ctx.arcPosition) + '/' + esc(ctx.arcTotal) + '</span>'
              : '') +
            (lesson.duration ? '<span class="crumb crumb--plain">' + esc(lesson.duration) +
              '</span>' : '') +
          '</div>' +
          (lesson.summary ? '<p class="muted">' + esc(lesson.summary) + '</p>' : '') +
        '</div>' +
        // Weeks 7-10 are one continuous project; a lesson opened out of sequence
        // otherwise refers to work the student has no record of doing.
        (ctx.continuesFrom
          ? '<div class="callout callout--continues"><div class="eyebrow">Carries on from earlier weeks</div>' +
            '<p>' + esc(ctx.continuesFrom) + '</p></div>'
          : '');

      // The pack states objectives twice: teacher phrasing in the lesson's front matter,
      // and the student-facing "I can…" list in the body. Showing both repeats the same
      // three points on one screen, so the header block only appears when the body has
      // no "I can…" section — and the student-facing wording always wins.
      var hasObjectiveSection = (lesson.sections || []).some(function (sec) {
        return sec.role === 'objectives';
      });
      if (!hasObjectiveSection && lesson.objectives && lesson.objectives.length) {
        html += '<section class="section section--objectives">' +
          '<div class="eyebrow">What you will be able to do</div><ul>' +
          lesson.objectives.map(function (o) { return '<li>' + richText(o) + '</li>'; }).join('') +
          '</ul></section>';
      }

      html += (lesson.sections || []).map(renderSection).join('');

      if (lesson.worksheet && lesson.worksheet.questions && lesson.worksheet.questions.length) {
        html += renderWorksheet(lesson.worksheet, data);
      }

      view.innerHTML = html;
      document.getElementById('back').onclick = function () { route('home', {}); };
      bindWorksheet(data);
    });
  }

  /*
   * The lesson design system.
   *
   * Every section carries a ROLE assigned at build time from the pack's own heading
   * conventions, and the role — not the lesson, not the grade — decides how it looks.
   * A student learns the code once and it holds for every lesson in every grade:
   * purple means take this in, gold means do something with it.
   */
  var ROLE_CHROME = {
    intro:      { eyebrow: '' },
    objectives: { eyebrow: 'What you will be able to do' },
    vocabulary: { eyebrow: 'Words to know' },
    explain:    { eyebrow: '' },
    important:  { eyebrow: '' },
    diagram:    { eyebrow: '' },
    reference:  { eyebrow: '' },
    activity:   { eyebrow: 'Do this' },
    discuss:    { eyebrow: 'Talk about it' },
    reflect:    { eyebrow: 'Reflect' }
  };

  /** Wraps a section's inner markup in its role's chrome. */
  function sectionShell(section, heading, inner) {
    var role = section.role || 'explain';
    var chrome = ROLE_CHROME[role] || {};
    return '<section class="section section--' + esc(role) + '">' +
      (chrome.eyebrow ? '<div class="eyebrow">' + esc(chrome.eyebrow) + '</div>' : '') +
      (heading ? '<h3>' + esc(heading) + '</h3>' : '') +
      inner +
      authoredNote(section) +
      '</section>';
  }

  /** Lesson body blocks. Authors pick a type per block in the lesson JSON. */
  function renderSection(section) {
    switch (section.type) {
      case 'text':
        return sectionShell(section, section.heading,
          (section.body || []).map(function (p) { return '<p>' + richText(p) + '</p>'; }).join(''));

      case 'list':
        return sectionShell(section, section.heading,
          '<ul>' + (section.items || []).map(function (i) {
            return '<li>' + richText(i) + '</li>';
          }).join('') + '</ul>');

      case 'steps':
        return sectionShell(section, section.heading,
          '<ol class="steps">' + (section.items || []).map(function (i) {
            return '<li>' + richText(i) + '</li>';
          }).join('') + '</ol>');

      case 'callout':
        return '<div class="callout">' +
          '<div class="eyebrow">' + esc(section.label || 'Remember') + '</div>' +
          (section.body || []).map(function (p) { return '<p>' + richText(p) + '</p>'; }).join('') +
          '</div>';

      case 'vocabulary':
        return sectionShell(section, section.heading || 'Key vocabulary',
          '<div class="vocab-grid">' + (section.terms || []).map(function (t) {
            return '<div class="vocab"><div class="vocab__term">' + esc(t.term) + '</div>' +
              '<div class="vocab__def">' + richText(t.definition) + '</div></div>';
          }).join('') + '</div>');

      case 'diagram':
        return renderDiagram(section);

      case 'reference':
        return '<section class="section reference-card">' +
          '<div class="eyebrow">' + esc(section.label || 'Reference') + '</div>' +
          (section.heading ? '<h3>' + esc(section.heading) + '</h3>' : '') +
          (section.intro ? '<p class="muted small">' + richText(section.intro) + '</p>' : '') +
          '<div class="reference-grid">' + (section.entries || []).map(function (e) {
            return '<div class="reference-item">' +
              '<div class="reference-item__term">' + esc(e.term) + '</div>' +
              '<div class="reference-item__ask">' + richText(e.asks) + '</div>' +
              (e.test ? '<div class="reference-item__test">' + richText(e.test) + '</div>' : '') +
              '</div>';
          }).join('') + '</div>' +
          authoredNote(section) + '</section>';

      case 'activity':
        return sectionShell(section, section.heading || section.label || '',
          (section.body || []).map(function (p) { return '<p>' + richText(p) + '</p>'; }).join('') +
          (section.items && section.items.length
            ? '<ol class="steps">' + section.items.map(function (i) {
                return '<li>' + richText(i) + '</li>';
              }).join('') + '</ol>'
            : ''));

      default:
        return '';
    }
  }

  /* ---------------------------------------------------------------------
   * Diagrams
   *
   * Lesson files hold a declarative spec, never markup: the renderer draws the SVG.
   * That keeps content as pure data — nothing in a lesson can inject markup into the
   * page — and it keeps every diagram on one visual grid instead of hand-drawn each time.
   *
   * Strokes and text use currentColor so both themes work, with the brand gold reserved
   * for the one element carrying the meaning.
   * ------------------------------------------------------------------- */

  /** A small marker on anything we wrote rather than took from the published pack. */
  function authoredNote(section) {
    if (!section.authored) return '';
    return '<p class="authored-note">Added by AISA to fill a gap in the published pack \u2014 ' +
      'not part of the ADEK material.</p>';
  }

  function renderDiagram(section) {
    var svg = section.variant === 'compare' ? diagramCompare(section) : diagramFlow(section);
    return '<figure class="diagram">' +
      (section.heading ? '<div class="eyebrow">' + esc(section.label || 'Diagram') + '</div>' +
        '<h3>' + esc(section.heading) + '</h3>' : '') +
      svg +
      (section.caption ? '<figcaption>' + richText(section.caption) + '</figcaption>' : '') +
      authoredNote(section) +
      '</figure>';
  }

  function svgOpen(w, h, label) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label) + '" ' +
      'xmlns="http://www.w3.org/2000/svg">' +
      '<defs><marker id="dgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" ' +
      'markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>';
  }

  /** Wraps a label to fit a box, returning tspan lines. */
  function wrapLines(text, perLine) {
    var words = String(text).split(/\s+/);
    var lines = [];
    var line = '';
    words.forEach(function (w) {
      if ((line + ' ' + w).trim().length > perLine && line) { lines.push(line); line = w; }
      else { line = (line + ' ' + w).trim(); }
    });
    if (line) lines.push(line);
    return lines;
  }

  /** A left-to-right chain: each box causes the next, with the link named on the arrow. */
  function diagramFlow(section) {
    var nodes = section.nodes || [];
    var edges = section.edges || [];
    var boxW = 180, boxH = 92, gap = 96, padX = 8, padY = 46;
    var w = padX * 2 + nodes.length * boxW + (nodes.length - 1) * gap;
    var h = padY + boxH + 30;

    var parts = [svgOpen(w, h, section.altText || section.heading || 'Diagram')];

    nodes.forEach(function (node, i) {
      var x = padX + i * (boxW + gap);
      var accent = node.accent === true;
      parts.push('<rect x="' + x + '" y="' + padY + '" width="' + boxW + '" height="' + boxH +
        '" rx="8" fill="none" stroke="' + (accent ? '#D8B664' : 'currentColor') +
        '" stroke-width="' + (accent ? 2.5 : 1.5) + '"/>');

      var label = wrapLines(node.label, 20);
      label.forEach(function (line, li) {
        parts.push('<text x="' + (x + boxW / 2) + '" y="' + (padY + 26 + li * 15) +
          '" text-anchor="middle" font-size="13" font-weight="700" ' +
          'fill="currentColor">' + esc(line) + '</text>');
      });
      if (node.detail) {
        wrapLines(node.detail, 24).slice(0, 3).forEach(function (line, li) {
          parts.push('<text x="' + (x + boxW / 2) + '" y="' +
            (padY + 30 + label.length * 15 + li * 13) + '" text-anchor="middle" font-size="11" ' +
            'fill="currentColor" opacity="0.72">' + esc(line) + '</text>');
        });
      }

      if (i < nodes.length - 1) {
        var ax = x + boxW + 10, ax2 = x + boxW + gap - 10, ay = padY + boxH / 2;
        parts.push('<line x1="' + ax + '" y1="' + ay + '" x2="' + ax2 + '" y2="' + ay +
          '" stroke="currentColor" stroke-width="1.5" marker-end="url(#dgArrow)"/>');
        var edge = edges[i];
        if (edge && edge.label) {
          wrapLines(edge.label, 14).forEach(function (line, li) {
            parts.push('<text x="' + ((ax + ax2) / 2) + '" y="' + (ay - 12 - (li ? 0 : 0) + li * 12) +
              '" text-anchor="middle" font-size="11" fill="currentColor" ' +
              'opacity="0.8">' + esc(line) + '</text>');
          });
        }
      }
    });
    return parts.join('') + '</svg>';
  }

  /** Two mechanisms side by side, so the difference is the thing you look at. */
  function diagramCompare(section) {
    var sides = [section.left || {}, section.right || {}];
    var panelW = 250, gap = 48, stepH = 44, padX = 8, padY = 44;
    var maxSteps = Math.max((sides[0].steps || []).length, (sides[1].steps || []).length);
    var w = padX * 2 + panelW * 2 + gap;
    var h = padY + maxSteps * stepH + 46;

    var parts = [svgOpen(w, h, section.altText || section.heading || 'Comparison')];

    sides.forEach(function (side, si) {
      var x = padX + si * (panelW + gap);
      var accent = side.accent === true;
      parts.push('<rect x="' + x + '" y="' + (padY - 30) + '" width="' + panelW + '" height="' +
        (maxSteps * stepH + 40) + '" rx="8" fill="none" stroke="' +
        (accent ? '#D8B664' : 'currentColor') + '" stroke-width="' + (accent ? 2.5 : 1.2) +
        '" opacity="' + (accent ? 1 : 0.55) + '"/>');
      parts.push('<text x="' + (x + panelW / 2) + '" y="' + (padY - 8) +
        '" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">' +
        esc(side.title || '') + '</text>');

      (side.steps || []).forEach(function (step, i) {
        var sy = padY + 16 + i * stepH;
        parts.push('<rect x="' + (x + 16) + '" y="' + sy + '" width="' + (panelW - 32) +
          '" height="28" rx="5" fill="currentColor" opacity="0.07"/>');
        parts.push('<text x="' + (x + panelW / 2) + '" y="' + (sy + 18) +
          '" text-anchor="middle" font-size="12" fill="currentColor">' + esc(step) + '</text>');
        if (i < (side.steps || []).length - 1) {
          parts.push('<line x1="' + (x + panelW / 2) + '" y1="' + (sy + 30) + '" x2="' +
            (x + panelW / 2) + '" y2="' + (sy + stepH - 4) +
            '" stroke="currentColor" stroke-width="1.4" marker-end="url(#dgArrow)"/>');
        }
      });
    });
    return parts.join('') + '</svg>';
  }

  /* ---------------------------------------------------------------------
   * Worksheet rendering
   * ------------------------------------------------------------------- */

  function renderWorksheet(worksheet, data) {
    var total = worksheet.questions.reduce(function (s, q) { return s + (q.marks || 0); }, 0);
    var openCount = worksheet.questions.filter(function (q) { return q.autoMarked === false; }).length;
    var markedCount = worksheet.questions.length - openCount;
    var locked = !data.canAttempt;

    var head = '<section class="section" style="margin-top:2.5rem;padding-top:1.5rem;' +
      'border-top:2px solid var(--aisa-purple-tint)">' +
      '<div class="eyebrow">Worksheet</div>' +
      '<h2>' + esc(worksheet.title || 'Check your understanding') + '</h2>' +
      '<p class="muted small">' +
        (markedCount ? markedCount + ' marked question' + (markedCount === 1 ? '' : 's') +
          ' worth ' + total + ' mark' + (total === 1 ? '' : 's') : '') +
        (markedCount && openCount ? ' · ' : '') +
        (openCount ? openCount + ' written response' + (openCount === 1 ? '' : 's') +
          ' your teacher reads' : '') +
        ' · attempt ' + Math.min(data.attempts + 1, data.maxAttempts) + ' of ' +
        data.maxAttempts + '</p>';

    if (locked) {
      head += '<div class="callout" style="margin-top:1rem"><div class="eyebrow">Attempts used</div>' +
        '<p>You have used all ' + data.maxAttempts + ' attempts. Your best score was ' +
        Math.round(data.best ? data.best.percent : 0) + '%. Speak to your teacher if you need another try.</p></div>';
    }
    head += '</section>';

    var questions = '<form id="worksheet">' +
      worksheet.questions.map(function (q, i) {
        return renderQuestion(q, i + 1, locked);
      }).join('') + '</form>';

    var actions = locked ? '' :
      '<div class="row between" style="margin-top:1.5rem">' +
        '<span class="muted small" id="answeredCount"></span>' +
        '<button type="button" class="btn btn--primary" id="submitBtn">Submit worksheet</button>' +
      '</div>';

    return head + questions + actions + '<div id="resultsPanel"></div>';
  }

  function renderQuestion(q, number, locked) {
    var body = '';
    var dis = locked ? ' disabled' : '';

    switch (q.type) {
      case 'mcq':
      case 'truefalse': {
        var options = q.type === 'truefalse'
          ? [{ id: 'true', text: 'True' }, { id: 'false', text: 'False' }]
          : (q.options || []);
        body = options.map(function (o) {
          return '<label class="option"><input type="radio" name="' + esc(q.id) + '" value="' +
            esc(o.id) + '"' + dis + '><span>' + richText(o.text) + '</span></label>';
        }).join('');
        break;
      }
      case 'multi':
        body = '<p class="muted small" style="margin-bottom:.5rem">Select all that apply.</p>' +
          (q.options || []).map(function (o) {
            return '<label class="option"><input type="checkbox" name="' + esc(q.id) + '" value="' +
              esc(o.id) + '"' + dis + '><span>' + richText(o.text) + '</span></label>';
          }).join('');
        break;

      case 'matching':
        body = (q.left || []).map(function (l) {
          return '<div class="match-row"><div class="left">' + richText(l.text) + '</div>' +
            '<select data-match="' + esc(q.id) + '" data-left="' + esc(l.id) + '"' + dis + '>' +
            '<option value="">Choose…</option>' +
            (q.right || []).map(function (r) {
              return '<option value="' + esc(r.id) + '">' + esc(r.text) + '</option>';
            }).join('') + '</select></div>';
        }).join('');
        break;

      case 'ordering':
        body = '<p class="muted small" style="margin-bottom:.5rem">Use the arrows to put these in order.</p>' +
          '<div data-order="' + esc(q.id) + '">' + (q.items || []).map(function (item, i) {
            return '<div class="order-item" data-item="' + esc(item.id) + '">' +
              '<span class="handle">' + (i + 1) + '</span>' +
              '<span class="text">' + richText(item.text) + '</span>' +
              '<button type="button" class="order-btn" data-move="up"' + dis + '>↑</button>' +
              '<button type="button" class="order-btn" data-move="down"' + dis + '>↓</button>' +
              '</div>';
          }).join('') + '</div>';
        break;

      case 'numeric':
        body = '<input type="number" step="any" data-input="' + esc(q.id) + '" ' +
          'placeholder="' + esc(q.placeholder || 'Your answer') + '"' + dis + '>';
        break;

      case 'fillBlank':
        body = '<div class="blanks">' + (q.blanks || []).map(function (label, i) {
          return '<input type="text" data-blank="' + esc(q.id) + '" data-index="' + i + '" ' +
            'placeholder="' + esc(label) + '"' + dis + '>';
        }).join('') + '</div>';
        break;

      case 'shortText':
      default:
        body = (q.stem ? '<p class="stem">' + richText(q.stem) + '</p>' : '') +
          '<textarea data-input="' + esc(q.id) + '" ' +
          'placeholder="' + esc(q.placeholder || 'Write your answer…') + '"' +
          (q.maxLength ? ' maxlength="' + esc(q.maxLength) + '"' : '') + dis + '></textarea>';
        break;
    }

    var isOpen = q.autoMarked === false;
    return '<div class="question' + (isOpen ? ' question--open' : '') + '" data-question="' +
      esc(q.id) + '" data-type="' + esc(q.type) + '"' + (isOpen ? ' data-open="1"' : '') + '>' +
      '<div class="q-head"><span class="q-num">' + number + '.</span>' +
      '<span class="q-prompt">' + richText(q.prompt) + '</span>' +
      '<span class="q-marks">' +
        (isOpen ? '<span class="read-pill" title="Your teacher reads this rather than it being ' +
                  'marked automatically">Teacher reads</span>'
                : esc(q.marks) + ' mark' + (q.marks === 1 ? '' : 's')) +
      '</span></div>' +
      body +
      (q.hint ? '<p class="muted small" style="margin-top:.5rem">Hint: ' + richText(q.hint) + '</p>' : '') +
      '</div>';
  }

  /* ---------------------------------------------------------------------
   * Worksheet interaction
   * ------------------------------------------------------------------- */

  function bindWorksheet(data) {
    var form = document.getElementById('worksheet');
    if (!form) return;

    // Highlight the chosen option and keep the answer map current.
    form.addEventListener('change', function (e) {
      var input = e.target;
      var question = input.closest('.question');
      if (question && (input.type === 'radio' || input.type === 'checkbox')) {
        Array.prototype.forEach.call(question.querySelectorAll('.option'), function (opt) {
          var box = opt.querySelector('input');
          opt.classList.toggle('selected', box && box.checked);
        });
      }
      updateAnsweredCount();
    });
    form.addEventListener('input', updateAnsweredCount);

    // Ordering controls.
    form.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-move]');
      if (!btn) return;
      var item = btn.closest('.order-item');
      var list = item.parentNode;
      if (btn.getAttribute('data-move') === 'up' && item.previousElementSibling) {
        list.insertBefore(item, item.previousElementSibling);
      } else if (btn.getAttribute('data-move') === 'down' && item.nextElementSibling) {
        list.insertBefore(item.nextElementSibling, item);
      }
      renumberOrder(list);
      updateAnsweredCount();
    });

    Array.prototype.forEach.call(form.querySelectorAll('[data-order]'), renumberOrder);
    updateAnsweredCount();

    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) submitBtn.onclick = function () { submitWorksheet(data); };
  }

  function renumberOrder(list) {
    Array.prototype.forEach.call(list.querySelectorAll('.order-item'), function (item, i, all) {
      item.querySelector('.handle').textContent = i + 1;
      item.querySelector('[data-move="up"]').disabled = (i === 0);
      item.querySelector('[data-move="down"]').disabled = (i === all.length - 1);
    });
  }

  /** Reads every question's current answer out of the DOM. */
  function collectAnswers() {
    var answers = {};
    Array.prototype.forEach.call(document.querySelectorAll('.question'), function (el) {
      var id = el.getAttribute('data-question');
      var type = el.getAttribute('data-type');

      if (type === 'mcq' || type === 'truefalse') {
        var picked = el.querySelector('input:checked');
        if (picked) answers[id] = picked.value;

      } else if (type === 'multi') {
        var boxes = el.querySelectorAll('input:checked');
        if (boxes.length) {
          answers[id] = Array.prototype.map.call(boxes, function (b) { return b.value; });
        }

      } else if (type === 'matching') {
        var map = {};
        var any = false;
        Array.prototype.forEach.call(el.querySelectorAll('select[data-left]'), function (sel) {
          if (sel.value) { map[sel.getAttribute('data-left')] = sel.value; any = true; }
        });
        if (any) answers[id] = map;

      } else if (type === 'ordering') {
        answers[id] = Array.prototype.map.call(el.querySelectorAll('.order-item'), function (item) {
          return item.getAttribute('data-item');
        });

      } else if (type === 'fillBlank') {
        var values = Array.prototype.map.call(el.querySelectorAll('[data-blank]'), function (input) {
          return input.value.trim();
        });
        if (values.some(function (v) { return v; })) answers[id] = values;

      } else {
        var field = el.querySelector('[data-input]');
        if (field && String(field.value).trim()) answers[id] = String(field.value).trim();
      }
    });
    return answers;
  }

  function updateAnsweredCount() {
    var counter = document.getElementById('answeredCount');
    if (!counter) return;
    var total = document.querySelectorAll('.question').length;
    var done = Object.keys(collectAnswers()).length;
    counter.textContent = done + ' of ' + total + ' answered';
  }

  function submitWorksheet(data) {
    var answers = collectAnswers();
    var total = document.querySelectorAll('.question').length;
    var unanswered = total - Object.keys(answers).length;

    if (unanswered > 0) {
      var ok = window.confirm(unanswered + ' question' + (unanswered === 1 ? '' : 's') +
        ' still blank. Unanswered questions score zero. Submit anyway?');
      if (!ok) return;
    }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Marking…';

    call('api_submitWorksheet', state.params.id, answers)
      .then(function (result) {
        state.lastResults = result;
        showResults(result);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Submit worksheet';
        toast(err.message, true);
      });
  }

  /** Marks each question in place and shows the score panel. */
  function showResults(result) {
    var byId = {};
    result.results.forEach(function (r) { byId[r.questionId] = r; });

    Array.prototype.forEach.call(document.querySelectorAll('.question'), function (el) {
      var r = byId[el.getAttribute('data-question')];
      if (!r) return;

      Array.prototype.forEach.call(el.querySelectorAll('input, textarea, select, button'), function (f) {
        f.disabled = true;
      });

      var fb = document.createElement('div');
      fb.className = 'feedback';

      if (r.needsTeacherReview) {
        // No tick, no cross, no score — nothing here has been judged yet.
        el.classList.add('is-recorded');
        fb.innerHTML = '<strong>Recorded</strong> · ' + esc(r.feedback);
        el.appendChild(fb);
        return;
      }

      el.classList.add(r.correct ? 'is-correct' : (r.partial ? 'is-partial' : 'is-wrong'));
      fb.innerHTML = '<strong>' + r.marksAwarded + '/' + r.marksAvailable + '</strong> · ' +
        esc(r.feedback) +
        (!r.correct && r.modelAnswer
          ? '<div class="model" style="margin-top:.4rem">Answer: ' + esc(r.modelAnswer) + '</div>'
          : '');
      el.appendChild(fb);
    });

    var actions = document.getElementById('submitBtn');
    if (actions && actions.parentNode) actions.parentNode.remove();

    var panel = document.getElementById('resultsPanel');
    panel.innerHTML =
      '<div class="hero" style="margin-top:1.5rem">' +
        ring(result.worksheetScore) +
        '<div class="hero-text">' +
          '<div class="eyebrow">Attempt ' + result.attempt + '</div>' +
          '<h1 style="font-size:1.5rem">Worksheet handed in</h1>' +
          '<p style="color:rgba(255,255,255,.8)">' +
            (result.marksAvailable > 0
              ? 'You scored <strong>' + result.marksAwarded + ' out of ' +
                result.marksAvailable + '</strong> on the marked questions. '
              : '') +
            (result.openResponses
              ? 'Your ' + result.openResponses + ' written response' +
                (result.openResponses === 1 ? ' has' : 's have') +
                ' been recorded for your teacher to read. '
              : '') +
            'Your teacher uses this alongside what you do and explain in lessons.' +
            (result.attemptsRemaining > 0
              ? ' You have ' + result.attemptsRemaining + ' attempt' +
                (result.attemptsRemaining === 1 ? '' : 's') + ' left — your best score counts.'
              : ' This was your final attempt.') +
          '</p>' +
          '<div class="row" style="margin-top:1rem">' +
            '<button class="btn btn--gold" id="backHome">Back to My Learning</button>' +
            (result.attemptsRemaining > 0
              ? '<button class="btn btn--ghost" style="background:rgba(255,255,255,.12);' +
                'color:#fff;border-color:rgba(255,255,255,.3)" id="retry">Try again</button>'
              : '') +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('backHome').onclick = function () { route('home', {}); };
    var retryBtn = document.getElementById('retry');
    if (retryBtn) retryBtn.onclick = function () { route('lesson', { id: state.params.id }); };

    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------------------------------------------------------------------
   * Attainment rendering shared by the student and teacher views
   * ------------------------------------------------------------------- */

  /**
   * A level chip. Emerging is the EXPECTED standard in Term 1, so nothing below
   * Advanced is styled as a warning — a cohort sitting at Emerging is the
   * framework working correctly, and the UI must not imply otherwise.
   */
  function levelChip(level) {
    if (!level || !level.level) {
      return '<span class="level-chip level-chip--none">Not yet judged</span>';
    }
    return '<span class="level-chip" style="background:' + esc(level.color || '#555') + '">' +
      esc(level.label) + '</span>';
  }

  function levelChipFor(strandRow) {
    if (!strandRow.judged) return '<span class="level-chip level-chip--none">Not yet judged</span>';
    return '<span class="level-chip" style="background:' + esc(strandRow.levelColor || '#555') + '">' +
      esc(strandRow.levelLabel) + '</span>';
  }

  /** The overall level plus the published rule that produced it. */
  function overallBlock(profile, expectedTier) {
    var o = profile.overall;
    if (!o.level) {
      return '<div class="card card--tint"><div class="eyebrow">Overall level</div>' +
        '<p style="font-size:1.2rem;font-weight:700;color:var(--aisa-purple)">Not yet complete</p>' +
        '<p class="muted small">' +
        (o.missingStrands && o.missingStrands.length
          ? 'Still to judge: ' + esc(o.missingStrands.join(', '))
          : 'No strands judged yet.') +
        '</p></div>';
    }
    return '<div class="card card--tint"><div class="eyebrow">Overall level</div>' +
      '<div style="margin:.3rem 0 .5rem">' + levelChip(o) + '</div>' +
      (o.isExpected
        ? '<p class="small" style="color:var(--aisa-purple)">This is the expected standard for Term 1.</p>'
        : '') +
      '<p class="muted small"><strong>Rule:</strong> ' + esc(o.rule) + '</p></div>';
  }

  /** The human label for a level key, from whatever the server sent. */
  function levelLabelOf(levels, key) {
    var match = (levels || []).filter(function (l) { return l.key === key; })[0];
    return match ? match.label : '';
  }

  /** One strand row: descriptors, level, evidence, note. */
  function strandRowHtml(s, opts) {
    opts = opts || {};
    var d = s.descriptors || {};
    return '<div class="strand-card' + (s.judged ? '' : ' strand-card--unjudged') + '">' +
      '<div class="strand-card__head">' +
        '<div><span class="code">' + esc(s.strand) + '</span> ' +
          '<strong>' + esc(s.label) + '</strong></div>' +
        levelChipFor(s) +
      '</div>' +
      (opts.showDescriptors !== false
        ? '<div class="descriptors">' +
            ['emerging', 'proficient', 'advanced'].map(function (tier) {
              var t = d[tier];
              if (!t) return '';
              var active = s.level === tier;
              return '<div class="descriptor' + (active ? ' is-active' : '') + '">' +
                '<span class="descriptor__tier">' + tier.charAt(0).toUpperCase() + tier.slice(1) +
                '</span><span class="descriptor__text">' + esc(t.descriptor) + '</span>' +
                '<span class="descriptor__code">' + esc(t.code) + '</span></div>';
            }).join('') +
          '</div>'
        : '') +
      (s.judged && s.note ? '<p class="small" style="margin-top:.5rem"><strong>Note:</strong> ' +
        esc(s.note) + '</p>' : '') +
      (s.judged && s.nextStep ? '<p class="small"><strong>Next step:</strong> ' +
        esc(s.nextStep) + '</p>' : '') +
      (s.judged
        ? '<div class="evidence-row">' +
            ['products', 'observations', 'conversations'].map(function (src) {
              var has = s.evidenceSources.indexOf(src) !== -1;
              return '<span class="evidence-pip' + (has ? ' is-present' : '') + '">' +
                (has ? '✓ ' : '✗ ') + src + '</span>';
            }).join('') +
            (s.singleSource
              ? '<span class="warn-pip" title="ADEK asks judgements to draw on three sources">' +
                '⚠ single source</span>'
              : '') +
          '</div>'
        : '') +
      '</div>';
  }

      var html = '<div class="eyebrow">My progress</div><h1>My AI Fluency profile</h1>' +

        data.students.map(function (st) {

          var nextSteps = st.profile.byStrand

          return '<tr class="clickable" data-student="' + esc(st.email) + '">' +
            '<td><strong>' + esc(st.displayName) + '</strong><br>' +
              '<span class="muted small">' + esc(st.email) + '</span></td>' +
            '<td>' + esc(st.className || '—') + '</td>' +
            strandCodes.map(function (c) {

  function bindTeacherControls() {
    Array.prototype.forEach.call(view.querySelectorAll('[data-student]'), function (row) {

  function downloadCsv(csv, filename) {
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  /**
   * The confirmation step: four proposed levels, one conversation, one click.
   *
   * The platform proposes a level per strand from the auto-marked work. The teacher asks
   * the prompt shown beside each — pitched at the tier being proposed, so the answer either
   * supports it or does not — then confirms or changes it. The whole thing is meant to take
   * about a minute per student, because the alternative was staff marking 159 written
   * answers, which was never going to happen.
   *
   * What is recorded says which of the two it was, so the record shows how each level was
   * actually reached.
   */
  function renderConfirmPanel(data) {
    var suggestions = data.suggestions || [];
    var byStrand = {};
    data.profile.byStrand.forEach(function (r) { byStrand[r.strand] = r; });

    var rows = suggestions.map(function (sug) {
      var current = byStrand[sug.strand] || {};
      var chosen = current.judged ? current.level : sug.suggested;
      var prompts = (data.interview || {})[sug.strand] || [];
      var promptFor = prompts.filter(function (p) { return p.level === chosen; })[0] ||
                      prompts[0] || {};

      return '<div class="confirm-row" data-confirm="' + esc(sug.strand) + '">' +
        '<div class="confirm-row__head">' +
          '<div><span class="code">' + esc(sug.strand) + '</span> <strong>' +
            esc(sug.label) + '</strong>' +
            // Without this, a re-check shows a level ticked that disagrees with the
            // proposal beside it and nothing says which is which.
            (current.judged
              ? '<div class="confirm-row__standing">Already recorded as <strong>' +
                esc(current.levelLabel) + '</strong>' +
                (current.judgedAt ? ' on ' + esc(formatDate(current.judgedAt)) : '') +
                (current.level === sug.suggested
                  ? ' \u2014 the work still supports it.'
                  : ', but the work now suggests <strong>' +
                    esc(levelLabelOf(data.levels, sug.suggested)) + '</strong>.') +
                '</div>'
              : '') +
          '</div>' +
          '<span class="muted small">' + esc(sug.reason) +
            (sug.notIndependent ? ' \u00B7 best of several attempts' : '') + '</span>' +
        '</div>' +

        '<div class="confirm-row__ask">' +
          '<div class="eyebrow">Ask, to check the proposed level</div>' +
          '<p class="ask" data-ask="' + esc(sug.strand) + '">' +
            esc(promptFor.ask || 'Talk through this strand with the student.') + '</p>' +
        '</div>' +

        '<div class="confirm-row__levels">' +
          data.levels.map(function (l) {
            var isSuggested = l.key === sug.suggested;
            return '<label class="level-pick' + (l.key === chosen ? ' is-chosen' : '') + '">' +
              '<input type="radio" name="confirm-' + esc(sug.strand) + '" value="' + esc(l.key) +
                '"' + (l.key === chosen ? ' checked' : '') + '>' +
              '<span class="level-pick__label" style="--lv:' + esc(l.color) + '">' +
                esc(l.label) + (isSuggested ? ' <em>proposed</em>' : '') + '</span></label>';
          }).join('') +
        '</div>' +

        '<input type="text" class="confirm-note" data-note="' + esc(sug.strand) + '" ' +
          'value="' + esc(current.note || '') + '" placeholder="Optional note \u2014 what they said">' +
        '</div>';
    }).join('');

    var anySuggestion = suggestions.some(function (s) { return s.suggested; });

    return '<section class="confirm-panel">' +
      '<div class="eyebrow">Record attainment</div>' +
      '<h2>Confirm the four strand levels</h2>' +
      '<p class="muted small">Levels below are proposed from this student\u2019s auto-marked work. ' +
      'Ask each question, then confirm or change. ' +
      '<strong>The proposal is AISA\u2019s convention, not an ADEK rule</strong> \u2014 the record ' +
      'stores which levels you confirmed and which you changed.</p>' +
      (anySuggestion ? rows
        : '<p class="muted" style="margin-top:.8rem">Not enough marked work yet to propose levels. ' +
          'They appear once the student has completed some worksheets.</p>') +
      (anySuggestion
        ? '<div class="row" style="margin-top:1rem">' +
          '<button class="btn btn--primary" id="confirmAll">Record all four levels</button>' +
          '<span class="muted small">Takes effect immediately and can be changed later.</span>' +
          '</div>'
        : '') +
      '</section>';
  }

  /** Keeps the visible prompt matched to whichever level is currently selected. */
  function bindConfirmPanel(data) {
    var panel = view.querySelector('.confirm-panel');
    if (!panel) return;

    panel.addEventListener('change', function (e) {
      var input = e.target;
      if (input.type !== 'radio') return;
      var strand = input.name.replace('confirm-', '');

      Array.prototype.forEach.call(
        panel.querySelectorAll('[name="' + input.name + '"]'), function (r) {
          r.closest('.level-pick').classList.toggle('is-chosen', r.checked);
        });

      var prompts = (data.interview || {})[strand] || [];
      var match = prompts.filter(function (p) { return p.level === input.value; })[0];
      var ask = panel.querySelector('[data-ask="' + strand + '"]');
      if (ask) {
        ask.textContent = match ? match.ask : 'Talk through this strand with the student.';
      }
    });

    var btn = document.getElementById('confirmAll');
    if (!btn) return;
    btn.onclick = function () {
      var decisions = {};
      (data.suggestions || []).forEach(function (sug) {
        var picked = panel.querySelector('[name="confirm-' + sug.strand + '"]:checked');
        if (!picked) return;
        var noteEl = panel.querySelector('[data-note="' + sug.strand + '"]');
        var prompts = (data.interview || {})[sug.strand] || [];
        var used = prompts.filter(function (p) { return p.level === picked.value; })[0];
        decisions[sug.strand] = {
          level: picked.value,
          suggested: sug.suggested,
          note: noteEl ? noteEl.value : '',
          evidenceProducts: sug.reason,
          evidenceConversations: used ? 'Asked: ' + used.ask : ''
        };
      });

      if (!Object.keys(decisions).length) { toast('Nothing to record.', true); return; }
      btn.disabled = true;
      btn.textContent = 'Recording\u2026';

      call('api_confirmSuggestions', { email: data.student.email, grade: '6', decisions: decisions })
        .then(function () {
          toast('Levels recorded');
          route('student-detail', { email: data.student.email });
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'Record all four levels';
          toast(err.message, true);
        });
    };
  }

  /** Wires the per-strand judgement forms. */
  function bindJudging(data) {
    Array.prototype.forEach.call(view.querySelectorAll('[data-judge]'), function (btn) {
      btn.onclick = function () {
        var strand = btn.getAttribute('data-judge');
        var panel = document.getElementById('judge-' + strand);
        if (!panel.hidden) { panel.hidden = true; return; }

        var s = data.profile.byStrand.filter(function (r) { return r.strand === strand; })[0];
        panel.innerHTML = judgeFormHtml(s, data);
        panel.hidden = false;
        panel.querySelector('[data-save]').onclick = function () {
          saveJudgement(strand, panel, data);
        };
        panel.querySelector('[data-cancel]').onclick = function () { panel.hidden = true; };
      };
    });
  }

  function judgeFormHtml(s, data) {
    var d = s.descriptors || {};
    return '<div class="judge-form__inner">' +
      '<div class="eyebrow">Level for ' + esc(s.label) + '</div>' +
      '<div class="level-options">' +
        data.levels.map(function (l) {
          var descriptor = d[l.key] ? d[l.key].descriptor : l.note;
          return '<label class="option' + (s.level === l.key ? ' selected' : '') + '">' +
            '<input type="radio" name="level-' + esc(s.strand) + '" value="' + esc(l.key) + '"' +
              (s.level === l.key ? ' checked' : '') + '>' +
            '<span><strong>' + esc(l.label) + '</strong><br>' +
            '<span class="small muted">' + esc(descriptor) + '</span></span></label>';
        }).join('') +
      '</div>' +
      '<div class="eyebrow" style="margin-top:1rem">Evidence — all three sources</div>' +
      data.evidenceSources.map(function (src) {
        var val = src.key === 'products' ? s.evidenceProducts
                : src.key === 'observations' ? s.evidenceObservations : s.evidenceConversations;
        return '<label class="field"><span class="field__label">' + esc(src.label) +
          ' <span class="muted">— ' + esc(src.hint) + '</span></span>' +
          '<input type="text" data-evidence="' + esc(src.key) + '" value="' + esc(val || '') +
          '" placeholder="e.g. ' + esc(src.key === 'products' ? 'Solution plan sheet'
            : src.key === 'observations' ? 'Card sort in W2 Lab' : 'Part 4 probe') + '"></label>';
      }).join('') +
      '<label class="field"><span class="field__label">Note</span>' +
        '<textarea data-field="note" placeholder="What you saw that decided the level">' +
        esc(s.note || '') + '</textarea></label>' +
      '<label class="field"><span class="field__label">Access arrangements used</span>' +
        '<input type="text" data-field="accessArrangements" value="' +
        esc(s.accessArrangements || '') + '"></label>' +
      '<label class="field"><span class="field__label">Next step / bridging</span>' +
        '<input type="text" data-field="nextStep" value="' + esc(s.nextStep || '') + '"></label>' +
      '<div class="row" style="margin-top:.85rem">' +
        '<button class="btn btn--primary btn--sm" data-save>Save judgement</button>' +
        '<button class="btn btn--ghost btn--sm" data-cancel>Cancel</button>' +
      '</div></div>';
  }

  function saveJudgement(strand, panel, data) {
    var picked = panel.querySelector('input[type="radio"]:checked');
    if (!picked) { toast('Choose a level first.', true); return; }

    var payload = {
      email: data.student.email,
      grade: '6',
      strand: strand,
      level: picked.value,
      assessmentEvent: 'final',
      note: panel.querySelector('[data-field="note"]').value,
      accessArrangements: panel.querySelector('[data-field="accessArrangements"]').value,
      nextStep: panel.querySelector('[data-field="nextStep"]').value
    };
    Array.prototype.forEach.call(panel.querySelectorAll('[data-evidence]'), function (input) {
      var key = input.getAttribute('data-evidence');
      payload['evidence' + key.charAt(0).toUpperCase() + key.slice(1)] = input.value;
    });

    var btn = panel.querySelector('[data-save]');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    call('api_recordJudgement', payload).then(function () {
      toast(strand + ' recorded');
      route('student-detail', { email: data.student.email });
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'Save judgement';
      toast(err.message, true);
    });
  }

      var email = document.getElementById('staffEmail').value.trim();
      var role = document.getElementById('staffRole').value;
      if (!email) { toast('Enter an email address.', true); return; }

      call('api_setStaffRole', email, role).then(function () {
        toast(email + ' set to ' + role);
        route('admin', {});
      }).catch(function (err) { toast(err.message, true); });
    };
  }

  /* ---------------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------------- */

  route('home', {});
})();
</script>
