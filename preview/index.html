<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyTwin — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* AISA brand tokens — never hardcode these values in rules below. */
  :root {
    --aisa-purple:        #21076C;
    --aisa-purple-mid:    #4B2E9E;
    --aisa-gold:          #D8B664;
    --aisa-white:         #FFFFFF;
    --aisa-near-black:    #1A1A1A;
    --aisa-muted-gray:    #555555;
    --aisa-purple-tint:   #F2EFFA;
    --aisa-purple-border: #C8BEE8;
    --aisa-font:          'DM Sans', system-ui, sans-serif;
    --aisa-radius:        8px;
    --shadow-sm: 0 1px 2px rgba(33, 7, 108, .06);
    --shadow-md: 0 4px 16px rgba(33, 7, 108, .10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--aisa-font);
    background: var(--aisa-white);
    color: var(--aisa-near-black);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { color: var(--aisa-purple); font-weight: 700; line-height: 1.25; }
  h1 { font-size: 1.9rem; }
  h2 { font-size: 1.35rem; }
  h3 { font-size: 1.1rem; }
  a { color: var(--aisa-purple-mid); }

  .eyebrow {
    font-size: .72rem; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--aisa-gold); margin-bottom: .35rem;
  }
  .muted { color: var(--aisa-muted-gray); }
  .small { font-size: .85rem; }
  .center { text-align: center; }

  /* ---------- App shell ---------- */
  .app-header {
    background: var(--aisa-purple); color: var(--aisa-white);
    padding: .85rem 1.5rem; display: flex; align-items: center;
    gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 20;
  }
  .app-header .brand {
    font-size: 1.3rem; font-weight: 700; color: var(--aisa-gold); letter-spacing: .04em;
  }
  .app-header .brand span { color: var(--aisa-white); font-weight: 500; }
  .app-header .school { font-size: .8rem; color: rgba(255,255,255,.7); }
  .header-spacer { flex: 1; }

  .nav { display: flex; gap: .35rem; flex-wrap: wrap; }
  .nav button {
    background: transparent; border: 1px solid rgba(255,255,255,.28);
    color: var(--aisa-white); font-family: inherit; font-size: .85rem;
    padding: .4rem .85rem; border-radius: 999px; cursor: pointer; transition: .15s;
  }
  .nav button:hover { background: rgba(255,255,255,.12); }
  .nav button.active { background: var(--aisa-gold); color: var(--aisa-purple); font-weight: 700; border-color: var(--aisa-gold); }

  .user-chip {
    display: flex; align-items: center; gap: .55rem;
    background: rgba(255,255,255,.1); padding: .3rem .75rem .3rem .3rem; border-radius: 999px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--aisa-gold);
    color: var(--aisa-purple); font-weight: 700; font-size: .8rem;
    display: grid; place-items: center; flex: none;
  }
  .user-chip .name { font-size: .85rem; }
  .user-chip .role {
    font-size: .65rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--aisa-gold); font-weight: 700;
  }

  main { max-width: 68rem; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--aisa-white); border: 1px solid var(--aisa-purple-border);
    border-radius: var(--aisa-radius); padding: 1.25rem; box-shadow: var(--shadow-sm);
  }
  .card--tint { background: var(--aisa-purple-tint); }
  .card--accent { border-left: 4px solid var(--aisa-gold); }

  /* ---------- Progress hero ---------- */
  .hero {
    background: var(--aisa-purple); color: var(--aisa-white);
    border-radius: var(--aisa-radius); padding: 1.75rem; margin-bottom: 1.75rem;
    display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;
  }
  .hero h1 { color: var(--aisa-white); margin-bottom: .3rem; }
  .hero .eyebrow { color: var(--aisa-gold); }
  .hero-text { flex: 1; min-width: 15rem; }
  .hero-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
  .stat .value { font-size: 2.1rem; font-weight: 700; color: var(--aisa-gold); line-height: 1.1; }
  .stat .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.72); }

  .ring { width: 104px; height: 104px; flex: none; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 1.4rem; font-weight: 700; color: var(--aisa-white);
  }

  /* ---------- Lesson cards ---------- */
  .unit { margin-bottom: 2rem; }
  .unit-head { margin-bottom: .9rem; padding-bottom: .5rem; border-bottom: 2px solid var(--aisa-purple-tint); }
  .lesson-grid { display: grid; gap: .85rem; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); }

  .lesson-card {
    border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
    padding: 1.1rem; cursor: pointer; transition: .18s; background: var(--aisa-white);
    display: flex; flex-direction: column; gap: .6rem; text-align: left; font-family: inherit;
    width: 100%;
  }
  .lesson-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--aisa-purple); }
  .lesson-card .top { display: flex; align-items: center; gap: .6rem; }
  .lesson-num {
    width: 2rem; height: 2rem; border-radius: 6px; background: var(--aisa-purple);
    color: var(--aisa-white); font-weight: 700; font-size: .9rem;
    display: grid; place-items: center; flex: none;
  }
  .lesson-card.is-lab .lesson-num { background: var(--aisa-gold); color: var(--aisa-purple); }
  .lesson-card h3 { font-size: 1rem; }
  .lesson-card p { font-size: .85rem; color: var(--aisa-muted-gray); }
  .lesson-meta { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: .5rem; }

  .pill {
    font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: .18rem .55rem; border-radius: 999px; white-space: nowrap;
  }
  .pill--lesson { background: var(--aisa-purple-tint); color: var(--aisa-purple); }
  .pill--lab { background: #FBF3DF; color: #7A6124; }
  .pill--complete { background: #E6F4EA; color: #1B6E3C; }
  .pill--attempted { background: #FDF1DC; color: #8A5A00; }
  .pill--not-started { background: #F1F1F4; color: var(--aisa-muted-gray); }

  .progress-bar { height: 6px; background: var(--aisa-purple-tint); border-radius: 999px; overflow: hidden; }
  .progress-bar > i { display: block; height: 100%; background: var(--aisa-gold); border-radius: 999px; }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
    border-radius: 6px; padding: .6rem 1.2rem; border: 1px solid transparent; transition: .15s;
  }
  .btn--primary { background: var(--aisa-purple); color: var(--aisa-white); }
  .btn--primary:hover { background: var(--aisa-purple-mid); }
  .btn--gold { background: var(--aisa-gold); color: var(--aisa-purple); }
  .btn--gold:hover { filter: brightness(1.06); }
  .btn--ghost { background: transparent; color: var(--aisa-purple); border-color: var(--aisa-purple-border); }
  .btn--ghost:hover { background: var(--aisa-purple-tint); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Lesson content ---------- */
  .lesson-head { margin-bottom: 1.5rem; }
  .section { margin-bottom: 1.5rem; }
  .section h3 { margin-bottom: .5rem; }
  .section p { margin-bottom: .7rem; }
  .section ul, .section ol { margin: 0 0 .8rem 1.3rem; }
  .section li { margin-bottom: .3rem; }

  .callout {
    background: var(--aisa-purple-tint); border-left: 4px solid var(--aisa-gold);
    border-radius: var(--aisa-radius); padding: 1rem 1.15rem; margin-bottom: 1.1rem;
  }
  .callout .eyebrow { margin-bottom: .25rem; }
  .keyword {
    display: inline-block; background: var(--aisa-purple); color: var(--aisa-white);
    padding: .1rem .45rem; border-radius: 4px; font-weight: 500; font-size: .92em;
  }
  .steps { counter-reset: step; list-style: none; margin-left: 0; }
  .steps li {
    counter-increment: step; position: relative; padding-left: 2.2rem; margin-bottom: .7rem;
  }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: .1rem;
    width: 1.6rem; height: 1.6rem; border-radius: 50%;
    background: var(--aisa-gold); color: var(--aisa-purple);
    font-weight: 700; font-size: .8rem; display: grid; place-items: center;
  }

  /* ---------- Worksheet ---------- */
  .question {
    border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
    padding: 1.15rem; margin-bottom: 1rem;
  }
  .question.is-correct { border-left: 4px solid #1B6E3C; background: #F7FCF8; }
  .question.is-partial { border-left: 4px solid var(--aisa-gold); background: #FFFDF7; }
  .question.is-wrong   { border-left: 4px solid #B3261E; background: #FFF8F8; }

  .q-head { display: flex; gap: .75rem; align-items: baseline; margin-bottom: .75rem; }
  .q-num { font-weight: 700; color: var(--aisa-purple); flex: none; }
  .q-prompt { flex: 1; font-weight: 500; }
  .q-marks { font-size: .75rem; color: var(--aisa-muted-gray); white-space: nowrap; }

  .option {
    display: flex; gap: .65rem; align-items: flex-start; padding: .6rem .8rem;
    border: 1px solid var(--aisa-purple-border); border-radius: 6px;
    margin-bottom: .45rem; cursor: pointer; transition: .12s;
  }
  .option:hover { background: var(--aisa-purple-tint); }
  .option input { margin-top: .3rem; accent-color: var(--aisa-purple); flex: none; }
  .option.selected { background: var(--aisa-purple-tint); border-color: var(--aisa-purple); }

  input[type="text"], input[type="number"], textarea, select {
    font-family: inherit; font-size: .95rem; width: 100%;
    padding: .6rem .75rem; border: 1px solid var(--aisa-purple-border);
    border-radius: 6px; color: var(--aisa-near-black); background: var(--aisa-white);
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--aisa-purple); outline-offset: 1px; border-color: var(--aisa-purple);
  }
  textarea { min-height: 5rem; resize: vertical; }

  .match-row { display: flex; gap: .7rem; align-items: center; margin-bottom: .5rem; flex-wrap: wrap; }
  .match-row .left { flex: 1; min-width: 10rem; }
  .match-row select { flex: 1; min-width: 10rem; width: auto; }

  .order-item {
    display: flex; gap: .7rem; align-items: center; padding: .55rem .8rem;
    border: 1px solid var(--aisa-purple-border); border-radius: 6px; margin-bottom: .4rem;
    background: var(--aisa-white);
  }
  .order-item .handle { font-weight: 700; color: var(--aisa-gold); }
  .order-item .text { flex: 1; }
  .order-btn {
    background: var(--aisa-purple-tint); border: none; border-radius: 4px;
    width: 1.8rem; height: 1.8rem; cursor: pointer; color: var(--aisa-purple); font-weight: 700;
  }
  .order-btn:disabled { opacity: .3; cursor: not-allowed; }

  .blanks { display: flex; gap: .5rem; flex-wrap: wrap; }
  .blanks input { width: auto; min-width: 8rem; flex: 1; }

  .feedback {
    margin-top: .75rem; padding: .7rem .85rem; border-radius: 6px;
    background: var(--aisa-purple-tint); font-size: .88rem;
  }
  .feedback .model { color: var(--aisa-purple); font-weight: 500; }

  /* ---------- Attainment ---------- */
  .band-chip {
    display: inline-block; padding: .2rem .6rem; border-radius: 999px;
    font-size: .72rem; font-weight: 700; color: var(--aisa-white); white-space: nowrap;
  }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .6rem .7rem; border-bottom: 1px solid var(--aisa-purple-border); }
  th {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--aisa-muted-gray); font-weight: 700; white-space: nowrap;
  }
  tbody tr:hover { background: var(--aisa-purple-tint); }
  tbody tr.clickable { cursor: pointer; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); }

  .standard-row { display: flex; align-items: center; gap: .9rem; padding: .7rem 0; border-bottom: 1px solid var(--aisa-purple-tint); }
  .standard-row .code { font-weight: 700; color: var(--aisa-purple); font-size: .8rem; min-width: 5.5rem; flex: none; }
  .standard-row .desc { flex: 1; font-size: .87rem; min-width: 12rem; }
  .standard-row .meter { width: 8rem; flex: none; }

  .dist { display: flex; height: 8px; border-radius: 999px; overflow: hidden; width: 8rem; }
  .dist > i { display: block; height: 100%; }

  /* ---------- Utility ---------- */
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }
  .stack > * + * { margin-top: 1rem; }
  .grid-2 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }

  .spinner {
    width: 2rem; height: 2rem; border: 3px solid var(--aisa-purple-tint);
    border-top-color: var(--aisa-purple); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 3rem auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: var(--aisa-purple); color: var(--aisa-white);
    padding: .8rem 1.3rem; border-radius: 999px; box-shadow: var(--shadow-md);
    font-size: .88rem; z-index: 50; max-width: 90vw;
  }
  .toast.error { background: #B3261E; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--aisa-muted-gray); }
  .empty h3 { margin-bottom: .4rem; }

  .breadcrumb {
    background: none; border: none; font-family: inherit; font-size: .85rem;
    color: var(--aisa-purple-mid); cursor: pointer; padding: 0; margin-bottom: .9rem;
  }
  .breadcrumb:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    main { padding: 1.25rem 1rem 3rem; }
    .hero { padding: 1.25rem; gap: 1.25rem; }
    h1 { font-size: 1.5rem; }
    .app-header { padding: .7rem 1rem; }
    .app-header .school { display: none; }
  }

  @media print {
    .app-header, .nav, .btn { display: none !important; }
    .card, .question { break-inside: avoid; }
  }
</style>

</head>

  var saved = null;
  try { saved = localStorage.getItem('studytwin-preview-role'); } catch (e) {}
  var startRole = PREVIEW_USERS[saved] ? saved : 'student';
  window.CURRENT_USER = PREVIEW_USERS[startRole];
  window.BOOTSTRAP_USER = window.CURRENT_USER;

  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.getElementById('previewBar');
    Array.prototype.forEach.call(bar.querySelectorAll('[data-role]'), function (btn) {
      var role = btn.getAttribute('data-role');
      if (role === startRole) btn.classList.add('active');

        try { localStorage.setItem('studytwin-preview-role', role); } catch (e) {}
        location.reload();
      };
    });
  });

/**
 * Auto-marking engine.
 *
 * Marking always happens on the server against the authoritative copy of the
 * content. Answer keys are stripped before any lesson is sent to a browser
 * (see stripAnswerKey_ in Content.gs), so a student cannot read the answers out
 * of the page source, and a crafted request cannot award itself marks — the
 * client only ever submits responses, never scores.
 *
 * Supported question types and how each is credited:
 *
 *   mcq        single correct option           all or nothing
 *   truefalse  a boolean                       all or nothing
 *   multi      several correct options         partial credit, penalised for wrong picks
 *   matching   left/right pairs                partial credit per correct pair
 *   ordering   a correct sequence              partial credit per item in the right place
 *   numeric    a value with a tolerance        all or nothing, tolerance-aware
 *   shortText  accepted answers / keywords     normalised comparison
 *   fillBlank  several short answers in a row  partial credit per blank
 */

/**
 * Marks a full worksheet submission.
 *
 * @param {Object} worksheet Authoritative worksheet definition (with answer keys).
 * @param {Object} answers   Map of questionId -> student response.
 * @return {{marksAwarded:number, marksAvailable:number, percent:number, results:Array}}
 */
function markWorksheet_(worksheet, answers) {
  answers = answers || {};
  const results = [];
  let awarded = 0;
  let available = 0;

  (worksheet.questions || []).forEach(function (question) {
    const response = answers[question.id];
    const result = markQuestion_(question, response);
    results.push(result);
    awarded += result.marksAwarded;
    available += result.marksAvailable;
  });

  return {
    marksAwarded: round2_(awarded),
    marksAvailable: round2_(available),
    percent: available > 0 ? round2_((awarded / available) * 100) : 0,
    results: results
  };
}

/** Marks a single question, dispatching on its type. */
function markQuestion_(question, response) {
  const marksAvailable = Number(question.marks) || 0;
  let awarded = 0;

  const answered = response !== undefined && response !== null && response !== '' &&
                   !(Array.isArray(response) && response.length === 0);

  if (answered) {
    switch (question.type) {
      case 'mcq':       awarded = markChoice_(question, response) * marksAvailable; break;
      case 'truefalse': awarded = markTrueFalse_(question, response) * marksAvailable; break;
      case 'multi':     awarded = markMulti_(question, response) * marksAvailable; break;
      case 'matching':  awarded = markMatching_(question, response) * marksAvailable; break;
      case 'ordering':  awarded = markOrdering_(question, response) * marksAvailable; break;
      case 'numeric':   awarded = markNumeric_(question, response) * marksAvailable; break;
      case 'shortText': awarded = markShortText_(question, response) * marksAvailable; break;
      case 'fillBlank': awarded = markFillBlank_(question, response) * marksAvailable; break;
      default:
        console.warn('Unknown question type "' + question.type + '" on ' + question.id);
        awarded = 0;
    }
  }

  awarded = round2_(Math.max(0, Math.min(awarded, marksAvailable)));
  const fraction = marksAvailable > 0 ? awarded / marksAvailable : 0;

  return {
    questionId: question.id,
    type: question.type,
    answered: answered,
    correct: fraction >= 0.999,
    partial: fraction > 0 && fraction < 0.999,
    marksAwarded: awarded,
    marksAvailable: marksAvailable,
    standards: question.standards || [],
    feedback: pickFeedback_(question, fraction, answered),
    // The model answer is released only after marking, so students learn from mistakes.
    modelAnswer: describeAnswer_(question)
  };
}

/* ---------------------------------------------------------------------------
 * Per-type markers. Each returns a fraction of the available marks, 0..1.
 * ------------------------------------------------------------------------- */

function markChoice_(question, response) {
  return String(response).trim() === String(question.answer).trim() ? 1 : 0;
}

function markTrueFalse_(question, response) {
  return toBool_(response) === toBool_(question.answer) ? 1 : 0;
}

/**
 * Multi-select.
 *
 * Credit is (proportion of correct options found) minus (proportion of
 * distractors wrongly selected), floored at zero. Scoring the two proportions
 * against their own totals is what makes ticking every box score exactly zero:
 * it earns 1 for finding them all and loses 1 for taking every distractor.
 *
 * A simpler (hits - misses) / correctCount does not hold that property — with
 * three correct options and two distractors, ticking everything would still pay
 * out a third of the marks for pure guessing.
 */
function markMulti_(question, response) {
  const key = (question.answer || []).map(normaliseKey_);
  const given = (Array.isArray(response) ? response : [response]).map(normaliseKey_);
  if (key.length === 0) return 0;

  const distractorCount = Math.max(0, (question.options || []).length - key.length);
  const unique = given.filter(function (v, i) { return given.indexOf(v) === i; });

  let hits = 0, misses = 0;
  unique.forEach(function (v) {
    if (key.indexOf(v) !== -1) hits++; else misses++;
  });

  // With no distractors there is nothing to wrongly select, so no penalty applies.
  const penalty = distractorCount > 0 ? (misses / distractorCount) : 0;
  return Math.max(0, (hits / key.length) - penalty);
}

/** Matching pairs: response is { leftId: rightId }. Credit per correct pair. */
function markMatching_(question, response) {
  const key = question.answer || {};
  const keys = Object.keys(key);
  if (keys.length === 0) return 0;
  if (typeof response !== 'object' || response === null) return 0;

  let hits = 0;
  keys.forEach(function (leftId) {
    if (normaliseKey_(response[leftId]) === normaliseKey_(key[leftId])) hits++;
  });
  return hits / keys.length;
}

/** Ordering: credit for each item sitting in its correct position. */
function markOrdering_(question, response) {
  const key = (question.answer || []).map(normaliseKey_);
  const given = (Array.isArray(response) ? response : []).map(normaliseKey_);
  if (key.length === 0) return 0;

  let hits = 0;
  for (let i = 0; i < key.length; i++) {
    if (given[i] === key[i]) hits++;
  }
  return hits / key.length;
}

/** Numeric with an inclusive tolerance (absolute, defaults to exact). */
function markNumeric_(question, response) {
  const expected = Number(question.answer);
  const given = Number(String(response).replace(/[, ]/g, ''));
  if (isNaN(given) || isNaN(expected)) return 0;

  const tolerance = Number(question.tolerance) || 0;
  return Math.abs(given - expected) <= tolerance + 1e-9 ? 1 : 0;
}

/**
 * Short free text. Three matching strategies, in order of preference:
 *
 *   acceptedAnswers  normalised exact match against any listed answer
 *   keywordsAll      every listed keyword must appear (credit is all-or-nothing)
 *   keywordsAny      credit scales with how many listed keywords appear
 *
 * Normalisation strips case, punctuation and filler words so that
 * "A computer program!" and "computer program" both match.
 */
function markShortText_(question, response) {
  const text = normaliseText_(response);
  if (!text) return 0;

  if (question.acceptedAnswers && question.acceptedAnswers.length) {
    const matched = question.acceptedAnswers.some(function (accepted) {
      return normaliseText_(accepted) === text;
    });
    if (matched) return 1;
    // Fall through: a longer sentence containing an accepted answer still counts.
    const contained = question.acceptedAnswers.some(function (accepted) {
      const norm = normaliseText_(accepted);
      return norm.length > 2 && text.indexOf(norm) !== -1;
    });
    if (contained) return 1;
  }

  if (question.keywordsAll && question.keywordsAll.length) {
    const all = question.keywordsAll.every(function (kw) {
      return text.indexOf(normaliseText_(kw)) !== -1;
    });
    return all ? 1 : 0;
  }

  if (question.keywordsAny && question.keywordsAny.length) {
    const hits = question.keywordsAny.filter(function (kw) {
      return text.indexOf(normaliseText_(kw)) !== -1;
    }).length;
    const needed = Number(question.keywordsNeeded) || 1;
    return Math.min(1, hits / needed);
  }

  return 0;
}

/** A row of blanks: response is an array, credit per blank filled correctly. */
function markFillBlank_(question, response) {
  const blanks = question.answer || [];
  if (blanks.length === 0) return 0;
  const given = Array.isArray(response) ? response : [response];

  let hits = 0;
  blanks.forEach(function (accepted, i) {
    const options = Array.isArray(accepted) ? accepted : [accepted];
    const answer = normaliseText_(given[i]);
    if (answer && options.some(function (o) { return normaliseText_(o) === answer; })) {
      hits++;
    }
  });
  return hits / blanks.length;
}

/* ---------------------------------------------------------------------------
 * Helpers
 * ------------------------------------------------------------------------- */

/** Lowercase, strip punctuation and filler words, collapse whitespace. */
function normaliseText_(value) {
  if (value === undefined || value === null) return '';
  return String(value)
    .toLowerCase()
    .replace(/[‘’“”]/g, "'")
    .replace(/[^a-z0-9'\s]/g, ' ')
    .replace(/\b(a|an|the|is|are|it|that|this|of|to)\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/** Identifier comparison — case and whitespace insensitive, punctuation preserved. */
function normaliseKey_(value) {
  if (value === undefined || value === null) return '';
  return String(value).toLowerCase().trim();
}

function toBool_(value) {
  if (typeof value === 'boolean') return value;
  const s = String(value).toLowerCase().trim();
  return s === 'true' || s === 'yes' || s === '1' || s === 't';
}

/** Chooses the feedback line a student sees for this question after marking. */
function pickFeedback_(question, fraction, answered) {
  const fb = question.feedback || {};
  if (!answered) return fb.unanswered || 'You did not answer this question.';
  if (fraction >= 0.999) return fb.correct || 'Correct.';
  if (fraction > 0) return fb.partial || fb.incorrect || 'Partly right — check the model answer.';
  return fb.incorrect || 'Not quite — check the model answer.';
}

/** Renders the answer key into something readable for post-submission review. */
function describeAnswer_(question) {
  switch (question.type) {
    case 'mcq': {
      const opt = (question.options || []).filter(function (o) {
        return String(o.id) === String(question.answer);
      })[0];
      return opt ? opt.text : String(question.answer);
    }
    case 'truefalse':
      return toBool_(question.answer) ? 'True' : 'False';
    case 'multi': {
      const byId = {};
      (question.options || []).forEach(function (o) { byId[String(o.id)] = o.text; });
      return (question.answer || []).map(function (id) {
        return byId[String(id)] || id;
      }).join('; ');
    }
    case 'matching': {
      const key = question.answer || {};
      const leftText = {}, rightText = {};
      (question.left || []).forEach(function (o) { leftText[String(o.id)] = o.text; });
      (question.right || []).forEach(function (o) { rightText[String(o.id)] = o.text; });
      return Object.keys(key).map(function (l) {
        return (leftText[l] || l) + ' → ' + (rightText[String(key[l])] || key[l]);
      }).join('; ');
    }
    case 'ordering': {
      const text = {};
      (question.items || []).forEach(function (o) { text[String(o.id)] = o.text; });
      return (question.answer || []).map(function (id, i) {
        return (i + 1) + '. ' + (text[String(id)] || id);
      }).join('  ');
    }
    case 'numeric':
      return String(question.answer) +
        (question.tolerance ? ' (±' + question.tolerance + ')' : '');
    case 'fillBlank':
      return (question.answer || []).map(function (a) {
        return Array.isArray(a) ? a[0] : a;
      }).join(', ');
    case 'shortText':
      return question.modelAnswer ||
        (question.acceptedAnswers || []).join(' / ') ||
        (question.keywordsAll || question.keywordsAny || []).join(', ');
    default:
      return '';
  }
}

function round2_(n) {
  return Math.round(n * 100) / 100;
}


/**
 * Curriculum content access.
 *
 * The curriculum itself lives in `curriculum/**` as plain JSON and is compiled
 * into `generated/CurriculumData.gs` by `npm run build`. Apps Script projects can
 * only hold .gs and .html files, so the build wraps the JSON rather than us
 * authoring lessons as code. The JSON stays the source of truth and stays
 * portable if the platform ever moves off Apps Script.
 */

/** Returns the course shell for a grade: units, lesson titles, standards. No answers. */
function getCourse_(gradeKey) {
  const course = CURRICULUM[gradeKey];
  if (!course) throw new Error('UNKNOWN_GRADE');
  return course;
}

/** Every lesson in a grade, in teaching order. */
function listLessons_(gradeKey) {
  const course = getCourse_(gradeKey);
  const ordered = [];
  (course.units || []).forEach(function (unit) {
    (unit.lessons || []).forEach(function (lessonId) {
      const lesson = course.lessons[lessonId];
      if (lesson) ordered.push(lesson);
    });
  });
  return ordered;
}

/** The authoritative lesson, answer keys intact. Server-side use only. */
function getLessonAuthoritative_(gradeKey, lessonId) {
  const course = getCourse_(gradeKey);
  const lesson = course.lessons[lessonId];
  if (!lesson) throw new Error('UNKNOWN_LESSON');
  return lesson;
}

/**
 * The student-safe copy of a lesson.
 *
 * This is the only version that ever crosses to a browser. Without the stripping
 * below, a student could open devtools and read every answer straight out of the
 * page payload, which would make the marks meaningless.
 */
function getLessonForStudent_(gradeKey, lessonId) {
  const lesson = getLessonAuthoritative_(gradeKey, lessonId);
  return stripAnswerKey_(lesson);
}

/** Deep-copies a lesson, removing every field that reveals or hints at an answer. */
function stripAnswerKey_(lesson) {
  const copy = JSON.parse(JSON.stringify(lesson));

  if (copy.worksheet && copy.worksheet.questions) {
    copy.worksheet.questions = copy.worksheet.questions.map(function (q) {
      const safe = {
        id: q.id,
        type: q.type,
        prompt: q.prompt,
        marks: q.marks,
        standards: q.standards || [],
        hint: q.hint || ''
      };

      // Presentation data the student legitimately needs in order to answer.
      if (q.options) {
        safe.options = q.options.map(function (o) { return { id: o.id, text: o.text }; });
      }
      if (q.left)  safe.left  = q.left.map(function (o) { return { id: o.id, text: o.text }; });
      if (q.right) safe.right = q.right.map(function (o) { return { id: o.id, text: o.text }; });
      if (q.items) safe.items = shuffle_(q.items.map(function (o) {
        return { id: o.id, text: o.text };
      }));
      if (q.blanks)      safe.blanks = q.blanks;
      if (q.placeholder) safe.placeholder = q.placeholder;
      if (q.maxLength)   safe.maxLength = q.maxLength;

      return safe;
    });
  }
  return copy;
}

/**
 * Fisher-Yates. Ordering questions ship shuffled, otherwise the items arrive in
 * the correct sequence and the question marks itself.
 */
function shuffle_(array) {
  const out = array.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
  }
  return out;
}

/** Flat map of standard code -> standard definition, for labelling attainment. */
function getStandardsIndex_(gradeKey) {
  const course = getCourse_(gradeKey);
  const index = {};
  (course.standards || []).forEach(function (s) { index[s.code] = s; });
  return index;
}

/** Total marks available across a whole grade — the denominator for overall progress. */
function getTotalMarksForGrade_(gradeKey) {
  return listLessons_(gradeKey).reduce(function (sum, lesson) {
    const questions = (lesson.worksheet && lesson.worksheet.questions) || [];
    return sum + questions.reduce(function (s, q) { return s + (Number(q.marks) || 0); }, 0);
  }, 0);
}


/**
 * Attainment against the AI Standards.
 *
 * Every worksheet question is tagged with the standard(s) it evidences. A
 * student's attainment against a standard is the marks they earned on questions
 * carrying that tag, over the marks available on those questions — counting only
 * their best attempt at each lesson.
 *
 * Marks a question carries are credited in full to each standard it is tagged
 * with rather than split between them. A question tagged with two standards is
 * evidence for both; halving it would understate attainment in each.
 *
 * That full crediting is correct per standard but must NOT be summed to produce
 * an overall figure — a question tagged twice would count twice, inflating the
 * total. The overall score is therefore computed separately, straight from the
 * marked results, counting every question exactly once. Without this split a
 * student who scored 46% on every paper reports as 52% overall, which reads as
 * a pass.
 */

/**
 * Builds the attainment picture for one student.
 *
 * @param {string} gradeKey
 * @param {Array}  submissions Best-attempt submission rows for this student.
 * @return {{byStandard: Array, overall: Object}}
 */
function computeAttainment_(gradeKey, submissions) {
  const standardsIndex = getStandardsIndex_(gradeKey);
  const totals = {}; // code -> { awarded, available, questions }

  // Counted once per question, regardless of how many standards it is tagged with.
  let rawAwarded = 0;
  let rawAvailable = 0;

  submissions.forEach(function (submission) {
    let results;
    try {
      results = JSON.parse(submission.resultsJson || '[]');
    } catch (err) {
      console.warn('Unparseable resultsJson on submission for ' + submission.lessonId);
      return;
    }

    results.forEach(function (result) {
      rawAwarded   += Number(result.marksAwarded)   || 0;
      rawAvailable += Number(result.marksAvailable) || 0;

      (result.standards || []).forEach(function (code) {
        if (!totals[code]) totals[code] = { awarded: 0, available: 0, questions: 0 };
        totals[code].awarded   += Number(result.marksAwarded)   || 0;
        totals[code].available += Number(result.marksAvailable) || 0;
        totals[code].questions += 1;
      });
    });
  });

  const byStandard = Object.keys(totals).map(function (code) {
    const t = totals[code];
    const percent = t.available > 0 ? (t.awarded / t.available) * 100 : 0;
    const definition = standardsIndex[code] || {};
    const band = bandFor_(percent);

    return {
      code: code,
      strand: definition.strand || '',
      descriptor: definition.descriptor || '',
      marksAwarded: round2_(t.awarded),
      marksAvailable: round2_(t.available),
      questionsAttempted: t.questions,
      percent: round2_(percent),
      band: band.key,
      bandLabel: band.label,
      bandColor: band.color
    };
  });

  byStandard.sort(function (a, b) { return a.code.localeCompare(b.code); });

  const overallPercent = rawAvailable > 0 ? (rawAwarded / rawAvailable) * 100 : 0;
  const overallBand = bandFor_(overallPercent);

  return {
    byStandard: byStandard,
    overall: {
      marksAwarded: round2_(rawAwarded),
      marksAvailable: round2_(rawAvailable),
      percent: round2_(overallPercent),
      band: overallBand.key,
      bandLabel: overallBand.label,
      bandColor: overallBand.color,
      standardsEvidenced: byStandard.length,
      standardsTotal: Object.keys(standardsIndex).length
    }
  };
}

/** First band whose threshold the percentage meets. Bands are ordered high to low. */
function bandFor_(percent) {
  const bands = CONFIG.ATTAINMENT_BANDS;
  for (let i = 0; i < bands.length; i++) {
    if (percent >= bands[i].min) return bands[i];
  }
  return bands[bands.length - 1];
}

/**
 * Class-level rollup: one row per standard with the cohort average and a
 * distribution across bands, so a teacher can see at a glance which standards
 * the class as a whole is weak on rather than reading 30 individual reports.
 */
function computeClassAttainment_(gradeKey, studentAttainments) {
  const standardsIndex = getStandardsIndex_(gradeKey);
  const agg = {}; // code -> { awarded, available, bands: {} , students: 0 }

  studentAttainments.forEach(function (student) {
    (student.attainment.byStandard || []).forEach(function (row) {
      if (!agg[row.code]) {
        agg[row.code] = { awarded: 0, available: 0, students: 0, bands: {} };
      }
      const a = agg[row.code];
      a.awarded   += row.marksAwarded;
      a.available += row.marksAvailable;
      a.students  += 1;
      a.bands[row.band] = (a.bands[row.band] || 0) + 1;
    });
  });

  return Object.keys(agg).map(function (code) {
    const a = agg[code];
    const percent = a.available > 0 ? (a.awarded / a.available) * 100 : 0;
    const band = bandFor_(percent);
    const definition = standardsIndex[code] || {};

    return {
      code: code,
      strand: definition.strand || '',
      descriptor: definition.descriptor || '',
      studentsAssessed: a.students,
      averagePercent: round2_(percent),
      band: band.key,
      bandLabel: band.label,
      bandColor: band.color,
      distribution: CONFIG.ATTAINMENT_BANDS.map(function (b) {
        return { band: b.key, label: b.label, color: b.color, count: a.bands[b.key] || 0 };
      })
    };
  }).sort(function (x, y) { return x.averagePercent - y.averagePercent; }); // weakest first
}

          { email: 'f.mansour@aisa.sch.ae', role: 'teacher', addedBy: 'b.abaki@aisa.sch.ae' }
        ],
        spreadsheetUrl: '#preview-no-spreadsheet',
        audit: auditLog.slice().reverse()
      };
    },

    api_importRoster: function (text) {
      var lines = String(text || '').split(/\r?\n/).filter(function (l) { return l.trim(); });
      var rejected = lines.filter(function (l) { return l.indexOf('@aisa.sch.ae') === -1; })
        .map(function (l) { return l + '  — not an @aisa.sch.ae address'; });
      return { added: lines.length - rejected.length, updated: 0, rejected: rejected };
    },

    api_setStaffRole: function (email, role) { return { email: email, role: role }; },

    api_exportCsv: function () {
      var lessons = lessonsInOrder();
      var header = ['Email', 'Name', 'Class']
        .concat(lessons.map(function (l) { return 'L' + l.number + ' %'; }))
        .concat(['Overall %', 'Band']);
      var rows = DEMO_STUDENTS.map(function (s) {
        var best = bestByLesson(mine(s.email));
        var a = computeAttainment_(GRADE, values(best));
        return [s.email, s.displayName, s.className]
          .concat(lessons.map(function (l) { return best[l.id] ? best[l.id].percent : ''; }))
          .concat([a.overall.percent, a.overall.bandLabel]);
      });
      return { csv: [header].concat(rows).map(function (r) { return r.join(','); }).join('\n') };
    }
  };

  /** Stub of google.script.run, including the success/failure handler chaining. */
  window.google = { script: { run: {} } };
  function makeRunner(onSuccess, onFailure) {
    var runner = {
      withSuccessHandler: function (fn) { return makeRunner(fn, onFailure); },
      withFailureHandler: function (fn) { return makeRunner(onSuccess, fn); }
    };
    Object.keys(API).forEach(function (name) {
      runner[name] = function () {
        var args = arguments;
        setTimeout(function () {      // mimic the network hop
          try {
            onSuccess({ ok: true, data: API[name].apply(null, args) });
          } catch (err) {
            console.error(err);
            if (onFailure) onFailure(err);
          }
        }, 140);
      };
    });
    return runner;
  }
  window.google.script.run = makeRunner(function () {}, function () {});
})();
