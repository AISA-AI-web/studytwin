<style>
  /* AISA brand tokens — never hardcode these values in rules below. */
  :root {
    --aisa-purple:        #21076C;
    --aisa-purple-mid:    #4B2E9E;
    --aisa-gold:          #D8B664;
    --aisa-white:         #FFFFFF;
    --aisa-near-black:    #1A1A1A;
    --aisa-muted-gray:    #555555;
    --aisa-purple-tint:   #F2EFFA;
    --aisa-purple-border: #C8BEE8;
    --aisa-font:          'DM Sans', system-ui, sans-serif;
    --aisa-radius:        8px;
    --shadow-sm: 0 1px 2px rgba(33, 7, 108, .06);
    --shadow-md: 0 4px 16px rgba(33, 7, 108, .10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--aisa-font);
    background: var(--aisa-white);
    color: var(--aisa-near-black);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { color: var(--aisa-purple); font-weight: 700; line-height: 1.25; }
  h1 { font-size: 1.9rem; }
  h2 { font-size: 1.35rem; }
  h3 { font-size: 1.1rem; }
  a { color: var(--aisa-purple-mid); }

  .eyebrow {
    font-size: .72rem; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--aisa-gold); margin-bottom: .35rem;
  }
  .muted { color: var(--aisa-muted-gray); }
  .small { font-size: .85rem; }
  .center { text-align: center; }

  /* ---------- App shell ---------- */
  .app-header {
    background: var(--aisa-purple); color: var(--aisa-white);
    padding: .85rem 1.5rem; display: flex; align-items: center;
    gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 20;
  }
  .app-header .brand {
    font-size: 1.3rem; font-weight: 700; color: var(--aisa-gold); letter-spacing: .04em;
  }
  .app-header .brand span { color: var(--aisa-white); font-weight: 500; }
  .app-header .school { font-size: .8rem; color: rgba(255,255,255,.7); }
  .header-spacer { flex: 1; }

  .nav { display: flex; gap: .35rem; flex-wrap: wrap; }
  .nav button {
    background: transparent; border: 1px solid rgba(255,255,255,.28);
    color: var(--aisa-white); font-family: inherit; font-size: .85rem;
    padding: .4rem .85rem; border-radius: 999px; cursor: pointer; transition: .15s;
  }
  .nav button:hover { background: rgba(255,255,255,.12); }
  .nav button.active { background: var(--aisa-gold); color: var(--aisa-purple); font-weight: 700; border-color: var(--aisa-gold); }

  .user-chip {
    display: flex; align-items: center; gap: .55rem;
    background: rgba(255,255,255,.1); padding: .3rem .75rem .3rem .3rem; border-radius: 999px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--aisa-gold);
    color: var(--aisa-purple); font-weight: 700; font-size: .8rem;
    display: grid; place-items: center; flex: none;
  }
  .user-chip .name { font-size: .85rem; line-height: 1.2; }
  .user-chip .account {
    font-size: .68rem; color: rgba(255,255,255,.65); line-height: 1.3;
    max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .user-chip .role-tag {
    font-size: .6rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--aisa-purple); background: var(--aisa-gold); font-weight: 700;
    padding: .1rem .4rem; border-radius: 3px; align-self: center;
  }
  .user-chip .switch {
    font-size: .68rem; color: var(--aisa-gold); text-decoration: underline;
    align-self: center; white-space: nowrap;
  }

  main { max-width: 68rem; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--aisa-white); border: 1px solid var(--aisa-purple-border);
    border-radius: var(--aisa-radius); padding: 1.25rem; box-shadow: var(--shadow-sm);
  }
  .card--tint { background: var(--aisa-purple-tint); }
  .card--accent { border-left: 4px solid var(--aisa-gold); }

  /* ---------- Progress hero ---------- */
  .hero {
    background: var(--aisa-purple); color: var(--aisa-white);
    border-radius: var(--aisa-radius); padding: 1.75rem; margin-bottom: 1.75rem;
    display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;
  }
  .hero h1 { color: var(--aisa-white); margin-bottom: .3rem; }
  .hero .eyebrow { color: var(--aisa-gold); }
  .hero-text { flex: 1; min-width: 15rem; }
  .hero-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
  .stat .value { font-size: 2.1rem; font-weight: 700; color: var(--aisa-gold); line-height: 1.1; }
  .stat .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.72); }

  .ring { width: 104px; height: 104px; flex: none; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 1.4rem; font-weight: 700; color: var(--aisa-white);
  }

  /* ---------- Lesson cards ---------- */
  .unit { margin-bottom: 2rem; }
  .unit-head { margin-bottom: .9rem; padding-bottom: .5rem; border-bottom: 2px solid var(--aisa-purple-tint); }
  .lesson-grid { display: grid; gap: .85rem; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); }

  .lesson-card {
    border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
    padding: 1.1rem; cursor: pointer; transition: .18s; background: var(--aisa-white);
    display: flex; flex-direction: column; gap: .6rem; text-align: left; font-family: inherit;
    width: 100%;
  }
  .lesson-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--aisa-purple); }
  .lesson-card .top { display: flex; align-items: center; gap: .6rem; }
  .lesson-num {
    width: 2rem; height: 2rem; border-radius: 6px; background: var(--aisa-purple);
    color: var(--aisa-white); font-weight: 700; font-size: .9rem;
    display: grid; place-items: center; flex: none;
  }
  .lesson-card.is-lab .lesson-num { background: var(--aisa-gold); color: var(--aisa-purple); }
  .lesson-card h3 { font-size: 1rem; }
  .lesson-card p { font-size: .85rem; color: var(--aisa-muted-gray); }
  .lesson-meta { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: .5rem; }

  .pill {
    font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: .18rem .55rem; border-radius: 999px; white-space: nowrap;
  }
  .pill--lesson { background: var(--aisa-purple-tint); color: var(--aisa-purple); }
  .pill--lab { background: #FBF3DF; color: #7A6124; }
  .pill--submitted { background: #E6F4EA; color: #1B6E3C; }
  .pill--not-started { background: #F1F1F4; color: var(--aisa-muted-gray); }

  .progress-bar { height: 6px; background: var(--aisa-purple-tint); border-radius: 999px; overflow: hidden; }
  .progress-bar > i { display: block; height: 100%; background: var(--aisa-gold); border-radius: 999px; }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
    border-radius: 6px; padding: .6rem 1.2rem; border: 1px solid transparent; transition: .15s;
  }
  .btn--primary { background: var(--aisa-purple); color: var(--aisa-white); }
  .btn--primary:hover { background: var(--aisa-purple-mid); }
  .btn--gold { background: var(--aisa-gold); color: var(--aisa-purple); }
  .btn--gold:hover { filter: brightness(1.06); }
  .btn--ghost { background: transparent; color: var(--aisa-purple); border-color: var(--aisa-purple-border); }
  .btn--ghost:hover { background: var(--aisa-purple-tint); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Lesson context ---------- */
  .lesson-crumbs { display: flex; gap: .4rem; flex-wrap: wrap; margin: .5rem 0 .6rem; }
  .crumb {
    font-size: .72rem; font-weight: 700; letter-spacing: .04em;
    padding: .2rem .6rem; border-radius: 999px;
    background: var(--aisa-purple-tint); color: var(--aisa-purple);
  }
  .crumb--week { background: var(--aisa-purple); color: var(--aisa-white); }
  .crumb--arc { background: var(--aisa-gold); color: var(--aisa-purple); }
  .crumb--plain {
    background: transparent; color: var(--aisa-muted-gray); font-weight: 400;
    padding-left: .2rem;
  }
  .callout--continues { border-left-color: var(--aisa-purple); }

  .track { margin-bottom: 2.5rem; }
  .track-head {
    border-bottom: 2px solid var(--aisa-purple); padding-bottom: .6rem; margin-bottom: 1.1rem;
  }
  .track-head h2 { font-size: 1.3rem; }
  .unit-head h3 { font-size: 1rem; color: var(--aisa-purple); }

  .lesson-num { flex-direction: column; line-height: 1; gap: 1px; }
  .lesson-num__label {
    font-size: .48rem; letter-spacing: .06em; opacity: .75; font-weight: 700;
  }

  /* ---------- Lesson content ----------
     THE LESSON DESIGN SYSTEM

     Each section carries a role assigned at build time from the pack's own headings, and
     the role decides its treatment. The code is deliberately simple so a Grade 6 student
     picks it up without being taught:

       purple  — take this in   (intro, vocabulary, reference)
       gold    — do something   (objectives, activity, reflect)
       plain   — read on        (explain)

     Because it keys on role rather than on the lesson, every grade added later inherits
     exactly this, with nothing to configure.
  */
  .lesson-head { margin-bottom: 1.5rem; }
  .section { margin-bottom: 1.4rem; }
  .section h3 { margin-bottom: .5rem; }

  /* Shared shell for the roles that carry a coloured band. */
  .section--intro,
  .section--objectives,
  .section--vocabulary,
  .section--activity,
  .section--discuss,
  .section--reflect {
    padding: 1rem 1.15rem;
    border-radius: var(--aisa-radius);
    border-left: 4px solid transparent;
  }

  /* Take this in */
  .section--intro {
    background: var(--aisa-purple-tint);
    border-left-color: var(--aisa-purple);
    font-size: 1.02rem;
  }
  .section--intro p:last-child { margin-bottom: 0; }

  .section--vocabulary {
    background: var(--aisa-purple-tint);
    border-left-color: var(--aisa-purple);
  }
  .vocab-grid { display: grid; gap: .55rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
  .vocab {
    background: var(--aisa-white); border-radius: 6px; padding: .6rem .75rem;
    border: 1px solid var(--aisa-purple-border);
  }
  .vocab__term { font-weight: 700; color: var(--aisa-purple); font-size: .92rem; }
  .vocab__def { font-size: .86rem; color: var(--aisa-near-black); }

  /* Do something */
  .section--objectives {
    background: var(--aisa-white);
    border: 1px solid var(--aisa-purple-border);
    border-left: 4px solid var(--aisa-gold);
  }
  .section--objectives ul { list-style: none; margin-left: 0; }
  .section--objectives li { position: relative; padding-left: 1.6rem; }
  .section--objectives li::before {
    content: '\2713'; position: absolute; left: 0; top: 0;
    color: var(--aisa-gold); font-weight: 700;
  }

  .section--activity {
    background: #FDF8EC;
    border-left-color: var(--aisa-gold);
  }
  .section--activity .eyebrow { color: #8A6D1F; }

  .section--reflect {
    background: #FDFBF5;
    border-left-color: var(--aisa-gold);
  }
  .section--reflect .eyebrow { color: #8A6D1F; }

  /* Read on / talk */
  .section--discuss {
    background: var(--aisa-white);
    border: 1px dashed var(--aisa-purple-border);
    border-left: 4px dashed var(--aisa-purple);
  }
  .section--explain { padding: 0; }
  .section p { margin-bottom: .7rem; }
  .section ul, .section ol { margin: 0 0 .8rem 1.3rem; }
  .section li { margin-bottom: .3rem; }

  .callout {
    background: var(--aisa-purple-tint); border-left: 4px solid var(--aisa-gold);
    border-radius: var(--aisa-radius); padding: 1rem 1.15rem; margin-bottom: 1.1rem;
  }
  .callout .eyebrow { margin-bottom: .25rem; }
  .keyword {
    display: inline-block; background: var(--aisa-purple); color: var(--aisa-white);
    padding: .1rem .45rem; border-radius: 4px; font-weight: 500; font-size: .92em;
  }
  .steps { counter-reset: step; list-style: none; margin-left: 0; }
  .steps li {
    counter-increment: step; position: relative; padding-left: 2.2rem; margin-bottom: .7rem;
  }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: .1rem;
    width: 1.6rem; height: 1.6rem; border-radius: 50%;
    background: var(--aisa-gold); color: var(--aisa-purple);
    font-weight: 700; font-size: .8rem; display: grid; place-items: center;
  }

  /* ---------- Diagrams and reference cards ---------- */
  .diagram {
    margin: 0 0 1.5rem; padding: 1.1rem 1.2rem;
    border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
    background: var(--aisa-white);
  }
  .diagram svg {
    display: block; width: 100%; max-width: 100%; height: auto;
    margin: .5rem auto .4rem; color: var(--aisa-purple);
  }
  .diagram figcaption {
    font-size: .86rem; color: var(--aisa-muted-gray); text-align: center;
    padding-top: .3rem; border-top: 1px solid var(--aisa-purple-tint);
  }

  .reference-card {
    border: 1px solid var(--aisa-purple-border); border-left: 4px solid var(--aisa-purple);
    border-radius: var(--aisa-radius); padding: 1.1rem 1.2rem; background: var(--aisa-white);
  }
  .reference-grid { display: grid; gap: .6rem; margin-top: .7rem; }
  .reference-item {
    display: grid; grid-template-columns: 8rem 1fr; gap: .2rem .9rem;
    padding: .6rem .75rem; background: var(--aisa-purple-tint); border-radius: 6px;
  }
  .reference-item__term {
    font-weight: 700; color: var(--aisa-purple); grid-row: span 2; align-self: center;
  }
  .reference-item__ask { font-size: .9rem; }
  .reference-item__test { font-size: .82rem; color: var(--aisa-muted-gray); }

  /* Anything we wrote rather than took from the published pack is labelled as such,
     so a teacher can always tell ADEK's material from ours. */
  .authored-note {
    font-size: .72rem; color: var(--aisa-muted-gray); font-style: italic;
    margin-top: .7rem; padding-top: .5rem; border-top: 1px dashed var(--aisa-purple-border);
  }

  @media (max-width: 560px) {
    .reference-item { grid-template-columns: 1fr; }
    .reference-item__term { grid-row: auto; }
  }

  /* ---------- Worksheet ---------- */
  .question {
    border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
    padding: 1.15rem; margin-bottom: 1rem;
  }
  /* An open task is read by a teacher, not marked. It gets no tick, no cross and
     no score, so it is styled as recorded rather than as right or wrong. */
  .question--open { border-left: 3px solid var(--aisa-purple-border); }
  .question.is-recorded { border-left: 4px solid var(--aisa-purple-mid); background: #FAF9FE; }
  .read-pill {
    font-size: .68rem; font-weight: 700; letter-spacing: .04em; white-space: nowrap;
    padding: .15rem .5rem; border-radius: 999px;
    background: var(--aisa-purple-tint); color: var(--aisa-purple);
  }
  .stem {
    background: var(--aisa-purple-tint); border-radius: 6px; padding: .6rem .8rem;
    margin-bottom: .6rem; font-size: .92rem; color: var(--aisa-purple);
  }

  /* Teacher-side reading of captured responses */
  .response {
    border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
    padding: .85rem 1rem; margin-bottom: .7rem; background: var(--aisa-white);
  }
  .response__prompt { font-size: .85rem; font-weight: 500; margin-bottom: .45rem; }
  .response__text {
    background: #FAFAFC; border-left: 3px solid var(--aisa-purple-mid);
    padding: .55rem .75rem; border-radius: 4px; font-size: .9rem; white-space: pre-wrap;
  }
  .response__lookfor {
    margin-top: .5rem; font-size: .8rem; color: var(--aisa-muted-gray);
  }
  .response__lookfor strong { color: var(--aisa-purple); }
  .response--blank .response__text { color: var(--aisa-muted-gray); font-style: italic; }

  .question.is-correct { border-left: 4px solid #1B6E3C; background: #F7FCF8; }
  .question.is-partial { border-left: 4px solid var(--aisa-gold); background: #FFFDF7; }
  .question.is-wrong   { border-left: 4px solid #B3261E; background: #FFF8F8; }

  .q-head { display: flex; gap: .75rem; align-items: baseline; margin-bottom: .75rem; }
  .q-num { font-weight: 700; color: var(--aisa-purple); flex: none; }
  .q-prompt { flex: 1; font-weight: 500; }
  .q-marks { font-size: .75rem; color: var(--aisa-muted-gray); white-space: nowrap; }

  .option {
    display: flex; gap: .65rem; align-items: flex-start; padding: .6rem .8rem;
    border: 1px solid var(--aisa-purple-border); border-radius: 6px;
    margin-bottom: .45rem; cursor: pointer; transition: .12s;
  }
  .option:hover { background: var(--aisa-purple-tint); }
  .option input { margin-top: .3rem; accent-color: var(--aisa-purple); flex: none; }
  .option.selected { background: var(--aisa-purple-tint); border-color: var(--aisa-purple); }

  input[type="text"], input[type="number"], textarea, select {
    font-family: inherit; font-size: .95rem; width: 100%;
    padding: .6rem .75rem; border: 1px solid var(--aisa-purple-border);
    border-radius: 6px; color: var(--aisa-near-black); background: var(--aisa-white);
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--aisa-purple); outline-offset: 1px; border-color: var(--aisa-purple);
  }
  textarea { min-height: 5rem; resize: vertical; }

  .match-row { display: flex; gap: .7rem; align-items: center; margin-bottom: .5rem; flex-wrap: wrap; }
  .match-row .left { flex: 1; min-width: 10rem; }
  .match-row select { flex: 1; min-width: 10rem; width: auto; }

  .order-item {
    display: flex; gap: .7rem; align-items: center; padding: .55rem .8rem;
    border: 1px solid var(--aisa-purple-border); border-radius: 6px; margin-bottom: .4rem;
    background: var(--aisa-white);
  }
  .order-item .handle { font-weight: 700; color: var(--aisa-gold); }
  .order-item .text { flex: 1; }
  .order-btn {
    background: var(--aisa-purple-tint); border: none; border-radius: 4px;
    width: 1.8rem; height: 1.8rem; cursor: pointer; color: var(--aisa-purple); font-weight: 700;
  }
  .order-btn:disabled { opacity: .3; cursor: not-allowed; }

  .blanks { display: flex; gap: .5rem; flex-wrap: wrap; }
  .blanks input { width: auto; min-width: 8rem; flex: 1; }

  .feedback {
    margin-top: .75rem; padding: .7rem .85rem; border-radius: 6px;
    background: var(--aisa-purple-tint); font-size: .88rem;
  }
  .feedback .model { color: var(--aisa-purple); font-weight: 500; }

  /* ---------- Attainment ---------- */
  /* Emerging is the EXPECTED standard in Term 1, so no level below Advanced is
     styled as a warning. A cohort at Emerging is the framework working. */
  .level-chip {
    display: inline-block; padding: .2rem .65rem; border-radius: 999px;
    font-size: .72rem; font-weight: 700; color: var(--aisa-white); white-space: nowrap;
  }
  .level-chip--none {
    background: transparent; color: var(--aisa-muted-gray);
    border: 1px dashed var(--aisa-purple-border); font-weight: 500;
  }
  .level-dot {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    vertical-align: middle;
  }
  .cell-unjudged { color: var(--aisa-purple-border); font-size: 1.3rem; text-align: center; }

  .strand-card {
    border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
    padding: 1rem 1.15rem; margin-bottom: .85rem; background: var(--aisa-white);
  }
  .strand-card--unjudged { background: #FCFCFD; border-style: dashed; }
  .strand-card__head {
    display: flex; justify-content: space-between; align-items: center;
    gap: .75rem; flex-wrap: wrap; margin-bottom: .6rem;
  }
  .strand-card__head .code {
    font-weight: 700; color: var(--aisa-gold); font-size: .78rem; letter-spacing: .06em;
  }

  .descriptors { display: grid; gap: .3rem; }
  .descriptor {
    display: grid; grid-template-columns: 6rem 1fr auto; gap: .6rem; align-items: baseline;
    padding: .4rem .6rem; border-radius: 5px; font-size: .84rem;
    border-left: 3px solid transparent;
  }
  .descriptor.is-active {
    background: var(--aisa-purple-tint); border-left-color: var(--aisa-gold); font-weight: 500;
  }
  .descriptor__tier {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--aisa-muted-gray); font-weight: 700;
  }
  .descriptor__code {
    font-size: .68rem; color: var(--aisa-muted-gray); white-space: nowrap; font-variant: tabular-nums;
  }

  .evidence-row { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .6rem; }
  .evidence-pip {
    font-size: .7rem; padding: .15rem .5rem; border-radius: 999px;
    background: #F1F1F4; color: var(--aisa-muted-gray);
  }
  .evidence-pip.is-present { background: #E6F4EA; color: #1B6E3C; }
  .warn-pip {
    font-size: .7rem; padding: .15rem .5rem; border-radius: 999px;
    background: #FDF1DC; color: #8A5A00; font-weight: 600;
  }

  /* ---------- Confirming suggested levels ---------- */
  /* The primary way a level gets recorded: the platform proposes, the teacher asks one
     question and confirms. Everything here is sized so four strands fit on one screen —
